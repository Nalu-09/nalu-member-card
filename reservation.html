<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lumière Nalu Reservation</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    body{
      margin:0;
      background:#000;
      color:#fff;
      font-family:"Times New Roman", serif;
      text-align:center;
      padding:32px 16px 40px;
    }

    .wrap{
      width:min(82vw, 340px);
      margin:0 auto;
    }

    .box{
      background:#0f0f0f;
      border:1px solid rgba(255,255,255,.08);
      border-radius:22px;
      padding:28px 22px;
      box-shadow:0 10px 30px rgba(0,0,0,.35);
    }

    .title{
      font-size:28px;
      margin:0 0 18px;
      letter-spacing:.08em;
    }

    .text{
      font-size:14px;
      line-height:1.9;
      opacity:.95;
      white-space:pre-wrap;
      margin:0 0 22px;
    }

    .memberInfo{
      font-size:13px;
      line-height:1.8;
      opacity:.9;
      margin:0 0 22px;
      white-space:pre-wrap;
    }

    .registered-food-info{
      display:none;
      margin:0 0 20px;
      padding:14px 16px;
      border:1px solid rgba(255,255,255,.14);
      border-radius:14px;
      background:rgba(255,255,255,.04);
      color:rgba(255,255,255,.86);
      font-size:13px;
      line-height:1.8;
      text-align:left;
      white-space:pre-wrap;
    }

    .field{
      margin:0 0 16px;
      text-align:left;
    }

    .field label{
      display:block;
      font-size:13px;
      margin:0 0 8px;
      opacity:.9;
    }

    .field input,
    .field select,
    .field textarea{
      width:100%;
      max-width:100%;
      box-sizing:border-box;
      background:#050505;
      color:#fff;
      border:1px solid rgba(255,255,255,.16);
      border-radius:14px;
      padding:12px 14px;
      font-size:14px;
      font-family:"Times New Roman", serif;
      outline:none;
    }

    .field textarea{
      min-height:88px;
      resize:vertical;
      line-height:1.7;
    }

    .field input::placeholder,
    .field textarea::placeholder{
      color:rgba(255,255,255,.45);
    }

    #eventDate{
      display:block;
      width:100%;
      max-width:100%;
      box-sizing:border-box;
      text-align:left;
      appearance:none;
      -webkit-appearance:none;
      min-height:46px;
    }

    #eventDate::-webkit-date-and-time-value{
      text-align:left;
    }

    #eventDate::-webkit-calendar-picker-indicator{
      filter:invert(1);
      opacity:.75;
    }

    .service-detail{
      margin-top:14px;
      padding:16px 18px;
      border:1px solid rgba(255,255,255,.14);
      border-radius:16px;
      color:rgba(255,255,255,.84);
      font-size:14px;
      line-height:1.9;
      text-align:left;
      white-space:pre-line;
      display:none;
    }

    .button{
      display:inline-block;
      background:#fff;
      color:#000;
      border:none;
      border-radius:999px;
      padding:12px 24px;
      font-size:14px;
      font-family:"Times New Roman", serif;
      cursor:pointer;
      margin-top:8px;
    }

    .button:disabled{
      opacity:.6;
      cursor:not-allowed;
    }

    .status{
      margin-top:18px;
      font-size:14px;
      line-height:1.8;
      white-space:pre-wrap;
      opacity:.95;
    }

    .hidden{
      display:none;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="box">
      <h1 class="title">Reservation</h1>

      <p class="text">
Lumière Nalu ご予約申込ページです。

会員番号とお名前を確認のうえ
お申し込みを受け付けます。
      </p>

      <div id="memberInfo" class="memberInfo"></div>

      <div id="formArea" class="hidden">
        <div class="field">
          <label for="memberNo">会員番号</label>
          <input
            type="text"
            id="memberNo"
            placeholder="例：000001"
            inputmode="numeric"
          >
        </div>

        <div class="field">
          <label for="inputName">お名前</label>
          <input
            type="text"
            id="inputName"
            placeholder="お名前"
          >
        </div>

        <div class="field">
          <label for="inputKana">お名前（カナ）</label>
          <input
            type="text"
            id="inputKana"
            placeholder="例：オナマエ"
          >
        </div>

        <div class="field">
          <label for="serviceId">イベント / 店舗名</label>
          <select id="serviceId">
            <option value="">読み込み中...</option>
          </select>
          <div id="serviceDetail" class="service-detail"></div>
        </div>

        <div class="field">
          <label for="eventDate">参加日</label>
          <input
            type="date"
            id="eventDate"
          >
        </div>

        <div id="dateCapacityStatus" class="service-detail"></div>

        <div class="field">
          <label for="people">人数</label>
          <select id="people" disabled>
            <option value="">先に日程を選択してください</option>
          </select>
        </div>

        <div class="field">
          <label for="companionName">ご同行される方のお名前</label>
          <textarea
            id="companionName"
            placeholder="2名以上でお申し込みの場合、ご同行者様のお名前をカナと併せてご入力ください"
          ></textarea>
        </div>

        <div id="registeredFoodInfo" class="registered-food-info"></div>

        <div class="field">
          <label for="allergy">アレルギー</label>
          <textarea
            id="allergy"
            placeholder="同行者様、または追加のアレルギーがある場合のみご入力ください"
          ></textarea>
        </div>

        <div class="field">
          <label for="dislike">苦手食材</label>
          <textarea
            id="dislike"
            placeholder="同行者様、または追加の苦手食材がある場合のみご入力ください"
          ></textarea>
        </div>

        <div class="field">
          <label for="message">連絡事項</label>
          <textarea
            id="message"
            placeholder="ご希望や確認事項があればご入力ください"
          ></textarea>
        </div>

        <button id="submitBtn" class="button">予約申込を送信する</button>
      </div>

      <div id="status" class="status">読み込み中...</div>
    </div>
  </div>

  <script>
    const LIFF_ID = "2007730715-wxTZ582n";
    const API_URL = "https://script.google.com/macros/s/AKfycbxOIqa-TOGIogMYIro9Qu0nG85vZ7ObLFT_YWLW3Q9XHbUmfbXVr9Oxk3zuUZxbtmXe/exec";

    const urlParams = new URLSearchParams(window.location.search);
    const rawState = urlParams.get("liff.state");
    const stateParams = new URLSearchParams((rawState || "").replace(/^\?/, ""));
    const SOURCE = urlParams.get("source") || stateParams.get("source") || "lumiere";

    let currentProfile = null;
    let currentMember = null;
    let currentServices = [];

    function updateServiceDetail() {
      const serviceSelect = document.getElementById("serviceId");
      const detail = document.getElementById("serviceDetail");

      if (!serviceSelect || !detail) return;

      const serviceId = serviceSelect.value;

      if (!serviceId) {
        detail.style.display = "none";
        detail.textContent = "";
        return;
      }

      const service = currentServices.find(function(item) {
        return String(item.serviceId) === String(serviceId);
      });

      if (!service) {
        detail.style.display = "none";
        detail.textContent = "";
        return;
      }

      let statusText = "受付中";

      if (service.status === "closed") {
        statusText = "受付終了";
      } else if (service.status === "full") {
        statusText = "現在満席です";
      }

      let text =
        service.serviceName + "\n\n" +
        "受付状況：" + statusText;

      if (service.deadlineText) {
        text += "\n申込締切：" + service.deadlineText;
      }

      detail.textContent = text;
      detail.style.display = "block";
    }

    function renderRegisteredFoodInfo(member) {
      const box = document.getElementById("registeredFoodInfo");

      if (!box) return;

      const allergy = member && member.allergy
        ? String(member.allergy).trim()
        : "";

      const dislikedFoods = member && member.dislikedFoods
        ? String(member.dislikedFoods).trim()
        : "";

      const lines = [];

      if (allergy && !isNoneText(allergy)) {
        lines.push("登録済みアレルギー：" + allergy + "（ご本人）");
      }

      if (dislikedFoods && !isNoneText(dislikedFoods)) {
        lines.push("登録済み苦手食材：" + dislikedFoods + "（ご本人）");
      }

      if (lines.length === 0) {
        box.style.display = "none";
        box.textContent = "";
        return;
      }

      box.textContent =
        lines.join("\n") +
        "\n\n同行者様、または追加事項がある場合のみ下記へご入力ください。";

      box.style.display = "block";
    }

    function isNoneText(value) {
      const text = String(value || "")
        .replace(/\s/g, "")
        .trim();

      return (
        text === "" ||
        text === "なし" ||
        text === "無し" ||
        text === "無" ||
        text === "-" ||
        text === "特になし"
      );
    }

    async function initReservation() {
      const status = document.getElementById("status");
      const formArea = document.getElementById("formArea");
      const memberInfo = document.getElementById("memberInfo");
      const serviceSelect = document.getElementById("serviceId");

      try {
        status.textContent = "LIFF初期化中...";

        await liff.init({ liffId: LIFF_ID });

        if (!liff.isLoggedIn()) {
          status.textContent = "LINEログイン中...";
          liff.login();
          return;
        }

        status.textContent = "プロフィール取得中...";
        currentProfile = await liff.getProfile();

        status.textContent = "会員情報を確認中...";

        const res = await fetch(API_URL, {
          method: "POST",
          body: new URLSearchParams({
            action: "getReservationOptions",
            lineUserId: currentProfile.userId,
            source: SOURCE
          })
        });

        const data = await res.json();

        if (!data.ok) {
          if (data.message === "member_not_found") {
            status.textContent =
              "会員情報が確認できませんでした。\n会員証発行後にご利用ください。";
            return;
          }

          status.textContent =
            "予約フォームを表示できませんでした。\n" +
            "エラー内容：" + (data.message || "unknown_error");
          return;
        }

        currentMember = data.member;
        currentServices = data.services || [];

        memberInfo.textContent =
          "Member No. " + currentMember.memberNo + "\n" +
          "Rank： " + currentMember.rank + "\n" +
          "Name： " + (currentMember.cardName || currentMember.name);

        renderRegisteredFoodInfo(currentMember);

        serviceSelect.innerHTML = "";

        const defaultOption = document.createElement("option");
        defaultOption.value = "";
        defaultOption.textContent = "選択してください";
        serviceSelect.appendChild(defaultOption);

        if (currentServices.length === 0) {
          const option = document.createElement("option");
          option.value = "";
          option.textContent = "現在選択可能な内容がありません";
          serviceSelect.appendChild(option);
        } else {
          currentServices.forEach(function(service) {
            const option = document.createElement("option");
            option.value = service.serviceId;

            const minPeopleText = getMinPeopleText(service);

if (service.status === "closed") {
  option.textContent = service.serviceName + "｜" + minPeopleText + "｜受付終了";
  option.disabled = true;
} else if (service.status === "full") {
  option.textContent = service.serviceName + "｜" + minPeopleText + "｜現在満席です";
  option.disabled = true;
} else {
  option.textContent = service.serviceName + "｜" + minPeopleText;
}

            serviceSelect.appendChild(option);
          });
        }

        formArea.classList.remove("hidden");
        status.textContent = "";

      } catch (e) {
        const errorMessage = String(e.message || "");

        if (
          errorMessage.includes("access token expired") ||
          errorMessage.includes("The access token expired")
        ) {
          status.textContent = "ログイン情報を更新しています。少しお待ちください。";

          try {
            liff.logout();
          } catch (logoutError) {}

          setTimeout(function() {
            liff.login();
          }, 500);

          return;
        }

        status.textContent =
          "読み込み中にエラーが発生しました。\n" +
          "エラー内容：" + errorMessage;
      }
    }

    async function submitReservation() {
      const status = document.getElementById("status");
      const btn = document.getElementById("submitBtn");

      const memberNo = document.getElementById("memberNo").value.trim();
      const inputName = document.getElementById("inputName").value.trim();
      const inputKana = document.getElementById("inputKana").value.trim();
      const serviceId = document.getElementById("serviceId").value;
      const eventDate = document.getElementById("eventDate").value;
      const people = document.getElementById("people").value;
      const companionName = document.getElementById("companionName").value.trim();
      const allergy = document.getElementById("allergy").value.trim();
      const dislike = document.getElementById("dislike").value.trim();
      const message = document.getElementById("message").value.trim();

      if (!currentProfile) {
        status.textContent = "LINEプロフィールを取得できていません。";
        return;
      }

      if (!memberNo) {
        status.textContent = "会員番号をご入力ください。";
        return;
      }

      if (!inputName) {
        status.textContent = "お名前をご入力ください。";
        return;
      }

      if (!inputKana) {
        status.textContent = "お名前（カナ）をご入力ください。";
        return;
      }

      if (!serviceId) {
        status.textContent = "イベント / 店舗名を選択してください。";
        return;
      }

      if (!eventDate) {
        status.textContent = "参加日を選択してください。";
        return;
      }

      if (!people) {
        status.textContent = "人数を選択してください。";
        return;
      }

      if (Number(people) >= 2 && !companionName) {
        status.textContent = "2名以上でお申し込みの場合、ご同行される方のお名前をカナと併せてご入力ください。";
        return;
      }

      try {
        btn.disabled = true;
        btn.textContent = "送信中...";

        const res = await fetch(API_URL, {
          method: "POST",
          body: new URLSearchParams({
            action: "submitReservation",
            lineUserId: currentProfile.userId,
            displayName: currentProfile.displayName || "",
            source: SOURCE,
            memberNo: memberNo,
            inputName: inputName,
            inputKana: inputKana,
            serviceId: serviceId,
            eventDate: eventDate,
            people: people,
            companionName: companionName,
            allergy: allergy,
            dislike: dislike,
            message: message
          })
        });

        const data = await res.json();

        if (!data.ok) {
          if (data.message === "member_not_found") {
            status.textContent =
              "会員情報が確認できませんでした。\n会員証発行後にご利用ください。";
          } else if (data.message === "member_no_mismatch") {
            status.textContent =
              "会員番号が一致しません。\n会員証をご確認のうえ、再度お試しください。";
          } else if (data.message === "name_mismatch") {
            status.textContent =
              "お名前が会員情報と一致しません。\n会員証の表記をご確認ください。";
          } else if (data.message === "service_not_allowed") {
            status.textContent =
              "現在のランクでは、選択された内容にお申し込みいただけません。";
          } else if (data.message === "kana_required") {
            status.textContent =
              "お名前（カナ）をご入力ください。";
          } else if (data.message === "companion_required") {
            status.textContent =
              "2名以上でお申し込みの場合、ご同行される方のお名前をご入力ください。";
          } else if (data.message === "deadline_closed") {
            status.textContent =
              "このお申し込みは受付終了しています。";
          } else if (data.message === "service_full" || data.message === "capacity_full") {
            status.textContent =
              "このお申し込みは現在満席です。";
          } else {
            status.textContent =
              "予約申込を受け付けできませんでした。\n" +
              "エラー内容：" + (data.message || "unknown_error");
          }

          btn.disabled = false;
          btn.textContent = "予約申込を送信する";
          return;
        }

        status.textContent =
          "予約申込を受け付けました。\n内容を確認のうえ、運営よりご案内いたします。";

        btn.style.display = "none";

      } catch (e) {
        status.textContent =
          "予約申込を受け付けできませんでした。\n" +
          "エラー内容：" + e.message;

        btn.disabled = false;
        btn.textContent = "予約申込を送信する";
      }
    }

    async function checkDateCapacity() {
      const statusBox = document.getElementById("dateCapacityStatus");
      const serviceId = document.getElementById("serviceId").value;
      const eventDate = document.getElementById("eventDate").value;
      const peopleSelect = document.getElementById("people");

      peopleSelect.innerHTML = "";
      peopleSelect.disabled = true;

      const defaultOption = document.createElement("option");
      defaultOption.value = "";
      defaultOption.textContent = "選択してください";
      peopleSelect.appendChild(defaultOption);

      if (!serviceId || !eventDate) {
        statusBox.style.display = "none";
        statusBox.textContent = "";

        peopleSelect.innerHTML = "";

        const option = document.createElement("option");
        option.value = "";
        option.textContent = "先にイベント名と日程を選択してください";
        peopleSelect.appendChild(option);

        peopleSelect.disabled = true;
        return;
      }

      statusBox.style.display = "block";
      statusBox.textContent = "残席を確認中...";

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          body: new URLSearchParams({
            action: "checkDateCapacity",
            source: SOURCE,
            serviceId: serviceId,
            eventDate: eventDate
          })
        });

        const data = await res.json();

        if (!data.ok) {
          statusBox.textContent =
            "残席を確認できませんでした。\n" +
            "エラー内容：" + (data.message || "unknown_error");
          peopleSelect.disabled = true;
          return;
        }

        peopleSelect.innerHTML = "";

        const firstOption = document.createElement("option");
        firstOption.value = "";
        firstOption.textContent = "選択してください";
        peopleSelect.appendChild(firstOption);

        if (data.remaining === null) {
          for (let i = 1; i <= 4; i++) {
            const option = document.createElement("option");
            option.value = String(i);
            option.textContent = i + "名";
            peopleSelect.appendChild(option);
          }

          peopleSelect.disabled = false;
          statusBox.textContent = "この日程は受付可能です。";
          return;
        }

        if (!data.available || Number(data.remaining) <= 0) {
          peopleSelect.innerHTML = "";

          const option = document.createElement("option");
          option.value = "";
          option.textContent = "満席です";
          peopleSelect.appendChild(option);

          peopleSelect.disabled = true;

          statusBox.textContent =
            "この日程は現在満席です。\n別日をご選択ください。";
          return;
        }

        const maxSelectable = Math.min(Number(data.remaining), 4);

        for (let i = 1; i <= maxSelectable; i++) {
          const option = document.createElement("option");
          option.value = String(i);
          option.textContent = i + "名";
          peopleSelect.appendChild(option);
        }

        peopleSelect.disabled = false;

        statusBox.textContent =
          "この日程は受付可能です。\n" +
          "残り：" + data.remaining + "名";

      } catch (e) {
        statusBox.textContent =
          "残席確認中にエラーが発生しました。\n" +
          "エラー内容：" + e.message;
        peopleSelect.disabled = true;
      }
    }

    document.addEventListener("DOMContentLoaded", function() {
      const btn = document.getElementById("submitBtn");
      const serviceSelect = document.getElementById("serviceId");
      const eventDateInput = document.getElementById("eventDate");

      if (btn) {
        btn.addEventListener("click", submitReservation);
      }

      if (serviceSelect) {
        serviceSelect.addEventListener("change", function() {
          updateServiceDetail();
          checkDateCapacity();
        });
      }

      if (eventDateInput) {
        eventDateInput.addEventListener("change", checkDateCapacity);
      }

      initReservation();
    });

    function getMinPeopleText(service) {
  const minPeople = Number(service.minPeople || 1);

  if (minPeople <= 1) {
    return "1名様より";
  }

  return minPeople + "名様より";
}
    
  </script>
</body>
</html>
