<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lumière Dining Reservation</title>
  <style>
    :root{color-scheme:dark}
    *{box-sizing:border-box}
    body{
  margin:0;
  background:#17201E;
  color:#F4F0E8;
  font-family:"Times New Roman",serif;
  text-align:center;
  padding:32px 16px 48px;
}
    .wrap{width:min(88vw,420px);margin:0 auto}
    .box{
  background:#202A27;
  border:1px solid rgba(244,240,232,.14);
  border-radius:22px;
  padding:28px 22px;
  box-shadow:0 10px 30px rgba(0,0,0,.28);
}
    .title{font-size:28px;margin:0 0 18px;letter-spacing:.08em}
    .text{font-size:14px;line-height:1.9;opacity:.95;white-space:pre-wrap;margin:0 0 22px}
    .member-card,
.detail,
.capacity,
.participant,
.confirmation,
.food-card{
  margin:0 0 20px;
  padding:16px 18px;
  border:1px solid rgba(255,255,255,.14);
  border-radius:16px;
  background:#202A27;
border:1px solid rgba(244,240,232,.14);
  text-align:left;
  font-size:13px;
  line-height:1.65;
}

.member-card{
  padding:12px 14px;
  margin-bottom:16px;
}

.member-grid{
  display:grid;
  grid-template-columns:92px minmax(0,1fr);
  gap:4px 10px;
  margin:0;
}

.member-grid dt,
.member-grid dd{
  margin:0;
  padding:0;
  line-height:1.55;
}

.member-grid dt{
  opacity:.58;
}

.member-grid dd{
  word-break:break-word;
}
    .member-grid dt{opacity:.58}.member-grid dd{margin:0;word-break:break-word}
    .section-title{font-size:17px;letter-spacing:.04em;margin:28px 0 16px;text-align:left}
    .field{margin:0 0 16px;text-align:left}
    .field label,.group-label{display:block;font-size:13px;margin:0 0 8px;opacity:.9}
    input,select,textarea{
  width:100%;
  max-width:100%;
  background:#151C1A;
  color:#F4F0E8;
  border:1px solid rgba(244,240,232,.18);
  border-radius:14px;
  padding:12px 14px;
  font-size:14px;
  font-family:"Times New Roman",serif;
  outline:none;
}
    textarea{min-height:88px;resize:vertical;line-height:1.7}
    input[readonly]{color:rgba(255,255,255,.76);background:#111}
    input::placeholder,textarea::placeholder{color:rgba(255,255,255,.42)}
    .radio-group{display:grid;gap:10px}
    .radio-card{display:flex;align-items:flex-start;gap:10px;padding:13px 14px;border:1px solid rgba(255,255,255,.14);border-radius:14px;background:#050505;cursor:pointer;font-size:13px;line-height:1.65}
    .radio-card input{width:18px;height:18px;min-width:18px;margin:2px 0 0;accent-color:#fff}
    .participant{padding:18px 16px}.participant h3{margin:0 0 14px;font-size:15px;font-weight:normal}
    .amount{font-size:15px;text-align:right;margin-top:8px}.amount strong{font-size:20px}
    .terms-box{margin:24px 0 18px;padding:18px 16px;border:1px solid rgba(255,255,255,.16);border-radius:16px;background:rgba(255,255,255,.035);text-align:left}
    .terms-title{margin:0 0 10px;font-size:14px}.terms-text,.privacy-note{color:rgba(255,255,255,.7);font-size:12px;line-height:1.8}
    .terms-links{display:flex;flex-direction:column;gap:10px;margin:0 0 16px}.terms-links a{color:#fff;font-size:13px;text-decoration:underline;text-underline-offset:4px}
    .consent-label{display:flex;align-items:flex-start;gap:10px;cursor:pointer;font-size:12px;line-height:1.8}.consent-label input{width:18px;height:18px;min-width:18px;margin:3px 0 0;accent-color:#fff}
    .actions{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:20px}
    .button{
  display:inline-block;
  background:#E8E0D2;
  color:#1A211F;
  border:none;
  border-radius:999px;
  padding:12px 24px;
  font-size:14px;
  font-family:"Times New Roman",serif;
  cursor:pointer;
  text-decoration:none;
}
    .button.secondary{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.35)}
    .button:disabled{opacity:.42;cursor:not-allowed}
    .status{margin-top:18px;font-size:14px;line-height:1.8;white-space:pre-wrap;opacity:.95}
    .hidden{display:none!important}
    .confirmation dl{display:grid;grid-template-columns:92px 1fr;gap:8px 12px;margin:0}.confirmation dt{opacity:.58}.confirmation dd{margin:0;white-space:pre-wrap;word-break:break-word}
    .notice{font-size:12px;line-height:1.8;color:rgba(255,255,255,.68)}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="box">
      <h1 class="title">Reservation</h1>
      <p class="text">Lumière Dining ご予約申込ページです。

会員情報を確認のうえ
お申し込みを受け付けます。</p>

      <div id="memberInfo" class="member-card hidden"></div>

      <div id="formScreen" class="hidden">
        <h2 class="section-title">Event</h2>
        <div class="field">
          <label for="serviceId">イベント</label>
          <select id="serviceId"><option value="">読み込み中...</option></select>
        </div>
        <div id="serviceDetail" class="detail hidden"></div>

        <div class="field">
          <label for="eventDate">開催日</label>
          <select id="eventDate" disabled><option value="">先にイベントを選択してください</option></select>
        </div>
        <div id="capacityStatus" class="capacity hidden"></div>

        <div class="field">
          <label for="guestCount">人数</label>
          <select id="guestCount" disabled><option value="">先に開催日を選択してください</option></select>
        </div>
        <div id="priceStatus" class="amount hidden"></div>

        <h2 class="section-title">Food Information</h2>
        <div id="registeredFood" class="food-card"></div>
        <div class="field">
          <label for="additionalAllergy">追加のアレルギー</label>
          <textarea id="additionalAllergy" placeholder="会員登録後に追加となった内容のみご入力ください"></textarea>
        </div>
        <div class="field">
          <label for="additionalDislikedFoods">追加の苦手食材</label>
          <textarea id="additionalDislikedFoods" placeholder="会員登録後に追加となった内容のみご入力ください"></textarea>
        </div>

        <h2 class="section-title">Representative</h2>
        <div class="field">
          <label for="representativePaymentMethod">代表者の支払い方法</label>
          <select id="representativePaymentMethod">
            <option value="">選択してください</option>
            <option value="CARD">クレジットカード</option>
            <option value="BANK_TRANSFER">銀行振込</option>
            <option value="PAYPAY">PayPay</option>
          </select>
        </div>

        <div
  id="paymentGuide"
  class="payment-guide hidden"
></div>

        <div id="participantsSection" class="hidden">
          <h2 class="section-title">Participants</h2>
          <div id="participants"></div>
        </div>

        <div class="terms-box">
          <p class="terms-title">規約・利用条件</p>
          <p class="terms-text">予約申込みにあたり、以下の規約と本開催案内に記載された料金・キャンセル条件をご確認ください。</p>
          <div class="terms-links">
            <a href="https://sudden-squid-b26.notion.site/Lumi-re-3992665c0f6b80e3a21ac0899c049098?source=copy_link" target="_blank" rel="noopener noreferrer">Lumière予約・利用規約</a>
            <a href="https://sudden-squid-b26.notion.site/Nalu-09-3992665c0f6b803baddfc14da896d526?source=copy_link" target="_blank" rel="noopener noreferrer">合同会社Nalu-09 プライバシーポリシー</a>
          </div>
          <label class="consent-label"><input type="checkbox" id="reservationConsent"><span>Lumière予約・利用規約および本開催案内に記載された料金・キャンセル条件を確認し、内容に同意します。</span></label>
          <p class="privacy-note">個人情報の取扱いについては、合同会社Nalu-09プライバシーポリシーをご確認ください。</p>
        </div>

        <div class="actions"><button id="confirmBtn" class="button" type="button">確認画面へ</button></div>
      </div>

      <div id="confirmScreen" class="hidden">
        <h2 class="section-title">Confirmation</h2>
        <div id="confirmation" class="confirmation"></div>
        <div class="actions">
          <button id="backBtn" class="button secondary" type="button">入力内容を修正</button>
          <button id="submitBtn" class="button" type="button">予約確定</button>
        </div>
      </div>

      <div id="completeScreen" class="hidden"></div>
      <div id="status" class="status">起動しています...</div>
    </section>
  </main>

  <script>
    'use strict';

    const LIFF_ID = '2007730715-wxTZ582n';
    const API_URL = 'https://script.google.com/macros/s/AKfycbzuXAKRg9B5AuPOi2ppj9VuaN8qM01vzLlLnIBFjWiNnjKh7rxzmB_BEG2-U0qAMmM8/exec';
    const SOURCE = getSource();

    const state = {
  profile: null,
  member: null,
  services: [],
  paymentSettings: {},
  selectedService: null,
  selectedEvent: null,
  capacity: null,
  draft: null,
  submitting: false,
};

    const $ = id => document.getElementById(id);

    function getSource() {
      const direct = new URLSearchParams(location.search);
      const nested = new URLSearchParams((direct.get('liff.state') || '').replace(/^\?/, ''));
      return direct.get('source') || nested.get('source') || 'lumiere';
    }

    function withTimeout(promise, milliseconds, message) {
      let timer;
      const timeout = new Promise((_, reject) => {
        timer = setTimeout(() => reject(new Error(message)), milliseconds);
      });
      return Promise.race([promise, timeout]).finally(() => clearTimeout(timer));
    }

    function loadLiffSdk() {
      if (window.liff) return Promise.resolve();

      return withTimeout(
        new Promise((resolve, reject) => {
          const script = document.createElement('script');
          script.src = 'https://static.line-scdn.net/liff/edge/2/sdk.js';
          script.async = true;
          script.onload = () => resolve();
          script.onerror = () => reject(new Error('LIFF SDKを読み込めませんでした。'));
          document.head.appendChild(script);
        }),
        15000,
        'LIFF SDKの読み込みが15秒を超えました。'
      );
    }

    async function api(action, payload) {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 20000);

      try {
        const body = new URLSearchParams(
          Object.assign({ action, source: SOURCE }, payload || {})
        );

        const response = await fetch(API_URL, {
          method: 'POST',
          body,
          redirect: 'follow',
          cache: 'no-store',
          signal: controller.signal,
        });

        const text = await response.text();

        if (!response.ok) {
          throw new Error('HTTP ' + response.status + '\n' + text.slice(0, 300));
        }

        if (!text) {
          throw new Error('APIの返答が空です。');
        }

        try {
          return JSON.parse(text);
        } catch (_) {
          throw new Error('APIの返答を解析できません。\n' + text.slice(0, 300));
        }
      } catch (error) {
        if (error && error.name === 'AbortError') {
          throw new Error('予約情報の取得が20秒を超えました。');
        }
        throw error;
      } finally {
        clearTimeout(timeoutId);
      }
    }

    async function resolveLineUserId() {
      const context = liff.getContext && liff.getContext();
      if (context && context.userId) return String(context.userId).trim();

      const decoded = liff.getDecodedIDToken && liff.getDecodedIDToken();
      if (decoded && decoded.sub) return String(decoded.sub).trim();

      const profile = await withTimeout(
        liff.getProfile(),
        10000,
        'LINEプロフィールの取得が10秒を超えました。'
      );

      return profile && profile.userId ? String(profile.userId).trim() : '';
    }

    async function init() {
      try {
        setStatus('1/6 LIFF SDKを読み込んでいます...');
        await loadLiffSdk();

        setStatus('2/6 LIFFを初期化しています...');
        await withTimeout(
          liff.init({ liffId: LIFF_ID }),
          15000,
          'LIFF初期化が15秒を超えました。'
        );

        setStatus('3/6 ログイン状態を確認しています...');
        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }

        const lineUserId = await resolveLineUserId();
        if (!lineUserId) {
          throw new Error('LINEユーザーIDを取得できませんでした。');
        }

        state.profile = { userId: lineUserId };

        setStatus('4/6 予約情報を取得しています...');
        const data = await api('getReservationOptions', { lineUserId });

        if (!data || !data.ok) {
          showApiError(data || { message: 'empty_response' });
          return;
        }

        setStatus('5/6 予約画面を作成しています...');
        state.member = data.member || {};
        state.services = Array.isArray(data.services) ? data.services : [];

        state.paymentSettings =
  data.paymentSettings || {};

        renderMember();
        renderRegisteredFood();
        renderServices();
        $('formScreen').classList.remove('hidden');

        setStatus('6/6 完了');
        setTimeout(() => setStatus(''), 400);
      } catch (error) {
        handleInitError(error);
      }
    }

    function renderMember() {
      $('memberInfo').innerHTML = `
        <dl class="member-grid">
          <dt>Member No</dt><dd>${escapeHtml(state.member.memberNo || '')}</dd>
          <dt>Name</dt><dd>${escapeHtml(state.member.name || '')}</dd>
          <dt>Card Name</dt><dd>${escapeHtml(state.member.cardName || '')}</dd>
          <dt>Rank</dt><dd>${escapeHtml(state.member.rankName || state.member.rank || '')}</dd>
        </dl>`;
      $('memberInfo').classList.remove('hidden');
    }

    function renderRegisteredFood() {
      $('registeredFood').textContent = [
        '登録済みアレルギー：' + displayNone(state.member.allergy),
        '登録済み苦手食材：' + displayNone(state.member.dislikedFoods),
        '',
        '追加・変更がある場合のみ、下欄へ入力してください。'
      ].join('\n');
    }

    function renderServices() {
      const select = $('serviceId');
      select.innerHTML = '<option value="">選択してください</option>';
      state.services.forEach(service => {
        const option = document.createElement('option');
        option.value = service.serviceId;
        option.disabled = service.status !== 'open';
        if (
  service.status ===
    'reservation_not_started' &&
  service.reservationStart
) {
  option.textContent =
    service.serviceName +
    '｜' +
    formatDate(
      service.reservationStart
    ) +
    'より受付開始';

} else {
  option.textContent =
    service.serviceName +
    (
      service.status === 'open'
        ? ''
        : '｜' +
          serviceStatusLabel(
            service.status
          )
    );
}
        select.appendChild(option);
      });
      if (!state.services.length) select.innerHTML = '<option value="">現在選択可能なイベントはありません</option>';
    }

    function onServiceChange() {
      state.selectedService = state.services.find(item => item.serviceId === $('serviceId').value) || null;
      state.selectedEvent = null;
      state.capacity = null;
      resetAfterService();
      if (!state.selectedService) return;

      $('serviceDetail').textContent = buildServiceDetail(state.selectedService);
      $('serviceDetail').classList.remove('hidden');
      const eventSelect = $('eventDate');
      eventSelect.innerHTML = '<option value="">開催日を選択してください</option>';
      (state.selectedService.events || []).forEach(event => {
        const option = document.createElement('option');
        option.value = event.eventId;
        option.disabled = !event.selectable;
        option.textContent = formatEventLabel(event);
        eventSelect.appendChild(option);
      });
      eventSelect.disabled = false;
    }

    async function onEventChange() {
      const eventId =
        String(
          $('eventDate').value || ''
        );

      state.selectedEvent =
        state.selectedService
          ? (
              state.selectedService.events || []
            ).find(
              function(item) {
                return (
                  String(item.eventId) ===
                  eventId
                );
              }
            ) || null
          : null;

      resetAfterEvent();

      if (!state.selectedEvent) {
        return;
      }

      const event =
        state.selectedEvent;

      state.capacity = {
        ok: true,
        capacity:
          event.capacity,
        reservedPeople:
          Number(
            event.reservedPeople || 0
          ),
        remaining:
          event.remaining,
        minPeople:
          Number(
            event.minPeople ||
            state.selectedService.minPeople ||
            1
          ),
        available:
          event.selectable !== false &&
          event.status !==
            'participation_cycle' &&
          event.status !==
            'capacity_full',
      };

      if (
        event.selectable === false ||
        event.status ===
          'participation_cycle'
      ) {
        $('capacityStatus').textContent =
          'この開催日は参加周期の対象外です。';
        $('capacityStatus')
          .classList.remove('hidden');
        $('guestCount').innerHTML =
          '<option value="">選択できません</option>';
        $('guestCount').disabled = true;
        return;
      }

      renderCapacity(
        state.capacity
      );
    }

    function renderCapacity(data) {
      const capacityText = data.capacity === null ? '設定なし' : data.capacity + '名';
      const remainingText = data.remaining === null ? '制限なし' : data.remaining + '名';
      $('capacityStatus').textContent = `定員：${capacityText}\n現在予約人数：${data.reservedPeople}名\n残席：${remainingText}`;

      const select = $('guestCount');
      select.innerHTML = '<option value="">選択してください</option>';
      const max = data.remaining === null
        ? 4
        : Math.min(Number(data.remaining), 4);
      if (!data.available || max < data.minPeople) {
        select.innerHTML = '<option value="">満席です</option>';
        select.disabled = true;
        return;
      }
      for (let i = data.minPeople; i <= max; i++) {
        const option = document.createElement('option');
        option.value = String(i);
        option.textContent = i + '名';
        select.appendChild(option);
      }
      select.disabled = false;
    }

    function onGuestCountChange() {
      const count = Number($('guestCount').value || 0);
      renderParticipants(Math.max(count - 1, 0));
      updatePrice();
    }

    function renderParticipants(count) {
      const container = $('participants');
      const existing = collectCompanions(false);
      container.innerHTML = '';
      $('participantsSection').classList.toggle('hidden', count === 0);

      for (let i = 0; i < count; i++) {
        const previous = existing[i] || {};
        const card = document.createElement('div');
        card.className = 'participant';
        card.dataset.index = String(i);
        card.innerHTML = `
          <h3>同行者 ${i + 1}</h3>
          <div class="field"><label>氏名</label><input class="participant-name" type="text" value="${escapeAttr(previous.name || '')}" placeholder="氏名をご入力ください"></div>
          <div class="field"><label>アレルギー</label><textarea class="participant-allergy" placeholder="ない場合は空欄">${escapeHtml(previous.allergy || '')}</textarea></div>
          <div class="field"><label>苦手食材</label><textarea class="participant-disliked" placeholder="ない場合は空欄">${escapeHtml(previous.dislikedFoods || '')}</textarea></div>
          <div class="field participant-payment-field"><label>支払い方法</label>
            <select class="participant-payment">
              <option value="">選択してください</option>
              <option value="REPRESENTATIVE" ${previous.paymentMethod === 'REPRESENTATIVE' ? 'selected' : ''}>代表者がまとめて支払う</option>
              <option value="BANK_TRANSFER" ${previous.paymentMethod === 'BANK_TRANSFER' ? 'selected' : ''}>銀行振込</option>
              <option value="PAYPAY" ${previous.paymentMethod === 'PAYPAY' ? 'selected' : ''}>PayPay</option>
            </select>
          </div>`;
        container.appendChild(card);
      }
    }

    function updatePrice() {
      const count = Number($('guestCount').value || 0);
      const price = state.selectedEvent && Number(state.selectedEvent.unitPrice);
      if (!count || !Number.isFinite(price)) { $('priceStatus').classList.add('hidden'); return; }
      $('priceStatus').innerHTML = `単価 ${formatMoney(price)} × ${count}名<br><strong>${formatMoney(price * count)}</strong>`;
      $('priceStatus').classList.remove('hidden');
    }

    function buildDraft() {
      if (!state.selectedService) throw new Error('イベントを選択してください。');
      if (!state.selectedEvent) throw new Error('開催日を選択してください。');
      const guestCount = Number($('guestCount').value || 0);
      if (!guestCount) throw new Error('人数を選択してください。');
      if (guestCount > 4) throw new Error('予約人数は最大4名までです。');
      const representativePaymentMethod = $('representativePaymentMethod').value;
      if (!representativePaymentMethod) throw new Error('代表者の支払い方法を選択してください。');
      if (!$('reservationConsent').checked) throw new Error('規約・料金・キャンセル条件への同意が必要です。');

      const companions = collectCompanions(true);
      if (companions.length !== guestCount - 1) throw new Error('同行者情報を確認してください。');
      companions.forEach((person, index) => {
        if (!person.name) throw new Error(`同行者${index + 1}の氏名を入力してください。`);
        if (!['REPRESENTATIVE', 'BANK_TRANSFER', 'PAYPAY'].includes(person.paymentMethod)) {
          throw new Error(`同行者${index + 1}の支払い方法を選択してください。`);
        }
      });

      return {
        serviceId: state.selectedService.serviceId,
        serviceName: state.selectedService.serviceName,
        eventId: state.selectedEvent.eventId,
        eventDate: state.selectedEvent.eventDate,
        startTime: state.selectedEvent.startTime,
        endTime: state.selectedEvent.endTime,
        guestCount,
        additionalAllergy: $('additionalAllergy').value.trim(),
        additionalDislikedFoods: $('additionalDislikedFoods').value.trim(),
        combinedAllergy: combineFood(state.member.allergy, $('additionalAllergy').value),
        combinedDislikedFoods: combineFood(state.member.dislikedFoods, $('additionalDislikedFoods').value),
        representativePaymentMethod,
        companions,
        unitPrice: Number(state.selectedEvent.unitPrice || 0),
        totalAmount: Number(state.selectedEvent.unitPrice || 0) * guestCount,
      };
    }

    function showConfirmation() {
      try {
        state.draft = buildDraft();
        const companionsText = state.draft.companions.length
          ? state.draft.companions.map((person, index) => `同行者${index + 1}：${person.name}\nアレルギー：${displayNone(person.allergy)}\n苦手食材：${displayNone(person.dislikedFoods)}\n支払い：${paymentLabel(person.paymentMethod)}`).join('\n\n')
          : 'なし';
        $('confirmation').innerHTML = `<dl>
          <dt>イベント</dt><dd>${escapeHtml(state.draft.serviceName)}</dd>
          <dt>開催日</dt><dd>${escapeHtml(formatDate(state.draft.eventDate) + formatTimeRange(state.draft))}</dd>
          <dt>人数</dt><dd>${state.draft.guestCount}名</dd>
          <dt>代表者</dt><dd>${escapeHtml(state.member.name || '')}</dd>
          <dt>同行者</dt><dd>${escapeHtml(companionsText)}</dd>
          <dt>アレルギー</dt><dd>${escapeHtml(displayNone(state.draft.combinedAllergy))}</dd>
          <dt>苦手食材</dt><dd>${escapeHtml(displayNone(state.draft.combinedDislikedFoods))}</dd>
          <dt>代表者支払い</dt><dd>${escapeHtml(paymentLabel(state.draft.representativePaymentMethod))}</dd>
          <dt>合計金額</dt><dd>${formatMoney(state.draft.totalAmount)}</dd>
        </dl>`;
        $('formScreen').classList.add('hidden');
        $('confirmScreen').classList.remove('hidden');
        setStatus('');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } catch (error) {
        setStatus(error.message);
      }
    }

    function backToForm() {
      $('confirmScreen').classList.add('hidden');
      $('formScreen').classList.remove('hidden');
      setStatus('');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function submitReservation() {
      if (state.submitting || !state.draft) return;
      state.submitting = true;
      $('submitBtn').disabled = true;
      $('submitBtn').textContent = '送信中...';
      setStatus('予約を確定しています...');

      try {
        const data = await api('submitReservation', {
          lineUserId: state.profile.userId,
          serviceId: state.draft.serviceId,
          eventId: state.draft.eventId,
          eventDate: state.draft.eventDate,
          guestCount: String(state.draft.guestCount),
          additionalAllergy: state.draft.additionalAllergy,
          additionalDislikedFoods: state.draft.additionalDislikedFoods,
          representativePaymentMethod: state.draft.representativePaymentMethod,
          companionsJson: JSON.stringify(state.draft.companions),
          reservationConsent: 'true',
        });
        if (!data.ok) {
          state.submitting = false;
          $('submitBtn').disabled = false;
          $('submitBtn').textContent = '予約確定';
          return showApiError(data);
        }
        showComplete(data);
      } catch (error) {
        state.submitting = false;
        $('submitBtn').disabled = false;
        $('submitBtn').textContent = '予約確定';
        setStatus('予約申込を受け付けできませんでした。\n' + error.message);
      }
    }

    function showComplete(data) {
      $('confirmScreen').classList.add('hidden');
      const hasCardUrl = Boolean(data.paymentUrl);
      const guidance = data.paymentGuidance || '';
      $('completeScreen').innerHTML = `
        <div class="confirmation">
          <p>予約を受け付けました。</p>
          <p>予約番号：${escapeHtml(data.reservationId || '')}</p>
          ${guidance ? `<p>${escapeHtml(guidance)}</p>` : ''}
          ${hasCardUrl ? `<div class="actions"><a class="button" href="${escapeAttr(data.paymentUrl)}">決済ページへ進む</a></div>` : ''}
        </div>`;
      $('completeScreen').classList.remove('hidden');
      setStatus('');
      if (hasCardUrl) setTimeout(() => { location.href = data.paymentUrl; }, 1600);
    }

    function collectCompanions(strict) {
      return Array.from(document.querySelectorAll('.participant')).map(card => ({
        name: card.querySelector('.participant-name').value.trim(),
        allergy: card.querySelector('.participant-allergy').value.trim(),
        dislikedFoods: card.querySelector('.participant-disliked').value.trim(),
        paymentMethod: card.querySelector('.participant-payment').value,
      })).filter(person => strict || person.name || person.allergy || person.dislikedFoods || person.paymentMethod);
    }

    function resetAfterService() {
      $('serviceDetail').classList.add('hidden');
      $('eventDate').innerHTML = '<option value="">先にイベントを選択してください</option>';
      $('eventDate').disabled = true;
      resetAfterEvent();
    }

    function resetAfterEvent() {
      $('capacityStatus').classList.add('hidden');
      $('guestCount').innerHTML = '<option value="">先に開催日を選択してください</option>';
      $('guestCount').disabled = true;
      renderParticipants(0);
      $('priceStatus').classList.add('hidden');
    }

    function buildServiceDetail(service) {
      const lines = ['受付状況：' + serviceStatusLabel(service.status)];
      if (service.participationCycleType === 'SKIP_EVENTS' && Number(service.participationCycleValue) > 0) lines.push('参加周期：参加後、次の開催を' + service.participationCycleValue + '回休止');
      if (service.participationCycleType === 'MONTHS' && Number(service.participationCycleValue) > 0) {
        lines.push('参加周期：前回参加日から' + service.participationCycleValue + 'か月後');
        if (service.nextAvailableDate) lines.push('次回申込可能日：' + formatDate(service.nextAvailableDate));
      }
      return lines.join('\n');
    }

    function formatEventLabel(event) {
      let text = formatDate(event.eventDate) + formatTimeRange(event) + '｜' + event.remainingText;
      if (Number.isFinite(Number(event.unitPrice))) text += '｜' + formatMoney(Number(event.unitPrice));
      return text;
    }

    function formatDate(value) {
      const parts = String(value || '').split('-').map(Number);
      if (parts.length !== 3 || !parts[0]) return String(value || '');
      const date = new Date(parts[0], parts[1] - 1, parts[2]);
      return `${parts[0]}年${parts[1]}月${parts[2]}日 ${['日','月','火','水','木','金','土'][date.getDay()]}曜日`;
    }

    function formatTimeRange(event) {
      if (event.startTime && event.endTime) return ` ${event.startTime}〜${event.endTime}`;
      if (event.startTime) return ` ${event.startTime}〜`;
      return '';
    }

    function combineFood(registered, additional) {
      return [registered, additional].map(value => String(value || '').trim()).filter(value => value && !isNone(value)).join(' / ') || 'なし';
    }

    function isNone(value) {
      return ['', 'なし', '無し', '無', '-', '特になし'].includes(String(value || '').trim());
    }

    function displayNone(value) { return isNone(value) ? 'なし' : String(value || '').trim(); }
    function formatMoney(value) { return new Intl.NumberFormat('ja-JP', { style: 'currency', currency: 'JPY', maximumFractionDigits: 0 }).format(Number(value || 0)); }
    function serviceStatusLabel(status) {
  return ({
    open:'受付中',
    full:'満席',
    closed:'受付終了',
    cycle_blocked:'次回申込対象外',
    reservation_not_started:'受付開始前'
  })[status] || status;
}
    function renderPaymentGuide() {
  const method =
    $('representativePaymentMethod').value;

  const box =
    $('paymentGuide');

  const settings =
    state.paymentSettings || {};

  if (!method) {
    box.innerHTML = '';
    box.classList.add('hidden');
    return;
  }

  if (method === 'CARD') {
    box.innerHTML = `
      <strong>クレジットカード決済</strong>
      <p>
        お申し込み完了後、自動で決済ページへ移動します。<br>
        移動先のページにて決済手続きをお願いいたします。
      </p>
    `;
    box.classList.remove('hidden');
    return;
  }

  if (method === 'BANK_TRANSFER') {
    box.innerHTML = `
      <strong>銀行振込</strong>
      <p>
        ${escapeHtml(settings.bankName || '')}<br>
        ${escapeHtml(settings.branchName || '')}<br>
        ${escapeHtml(settings.accountType || '')}
        ${escapeHtml(settings.accountNumber || '')}<br>
        口座名義：${escapeHtml(settings.accountName || '')}
        <br><br>
        お申し込み完了後、上記口座へお振り込みをお願いいたします。
      </p>
    `;
    box.classList.remove('hidden');
    return;
  }

  if (method === 'PAYPAY') {
    box.innerHTML = `
      <strong>PayPay</strong>
      <p>
        PayPay ID：${escapeHtml(settings.paypayId || '')}<br>
        受け取り名義：${escapeHtml(settings.paypayName || '')}
        <br><br>
        お申し込み完了後、上記宛先へお支払いをお願いいたします。
      </p>
    `;
    box.classList.remove('hidden');
    return;
  }

  box.innerHTML = '';
  box.classList.add('hidden');
}
    
    function paymentLabel(method) { return ({ CARD:'クレジットカード', PAYPAY:'PayPay', BANK_TRANSFER:'銀行振込', REPRESENTATIVE:'代表者がまとめて支払う' })[method] || method; }
    function setStatus(message) { $('status').textContent = message || ''; }

    function showApiError(data, target) {
      const messages = {
  member_not_found:
    '会員情報が確認できませんでした。\n会員証発行後にご利用ください。',

  member_rank_not_found:
    '会員ランクを確認できませんでした。',

  service_not_allowed:
    '現在のランクでは、このイベントにお申し込みいただけません。',

  event_not_found:
    '開催情報を確認できませんでした。',

  reservation_not_started:
    data.reservationStart
      ? `${formatDate(data.reservationStart)}よりお申し込みいただけます。`
      : '現在はまだ予約受付開始前です。',

  deadline_closed:
    'この開催日の受付は終了しています。',

  capacity_full:
    'この開催日は満席です。',

  participation_cycle:
    '参加周期のため、この開催日にはお申し込みいただけません。',

  min_people_required:
    `このイベントは${data.minPeople || ''}名以上でお申し込みください。`,

  active_price_not_found:
    '適用価格を確認できませんでした。',

  participant_count_mismatch:
    '人数と同行者情報が一致していません。',

  participant_name_required:
    `同行者${data.participantNo || ''}の氏名を入力してください。`,

  participant_payment_method_required:
    `同行者${data.participantNo || ''}の支払い方法を選択してください。`,

  reservation_consent_required:
    '規約・料金・キャンセル条件への同意が必要です。',
};
      const message = messages[data.message] || `処理できませんでした。\nエラー内容：${data.message || 'unknown_error'}`;
      if (target) target.textContent = message; else setStatus(message);
    }

    function handleInitError(error) {
      const message = String(error && error.message || error || '');
      if (/access token expired/i.test(message)) {
        try { liff.logout(); } catch (_) {}
        liff.login();
        return;
      }
      setStatus('読み込み中にエラーが発生しました。\n' + message);
    }

    function escapeHtml(value) {
      return String(value || '').replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
    }
    function escapeAttr(value) { return escapeHtml(value); }

    function bindEvents() {
  $('serviceId').addEventListener('change', onServiceChange);
  $('eventDate').addEventListener('change', onEventChange);
  $('guestCount').addEventListener('change', onGuestCountChange);

  $('representativePaymentMethod')
    .addEventListener(
      'change',
      renderPaymentGuide
    );

  $('confirmBtn').addEventListener('click', showConfirmation);
  $('backBtn').addEventListener('click', backToForm);
  $('submitBtn').addEventListener('click', submitReservation);
}

    window.addEventListener('error', event => {
      setStatus('JavaScriptエラー\n' + (event.message || 'unknown_error'));
    });

    window.addEventListener('unhandledrejection', event => {
      const reason = event.reason && event.reason.message
        ? event.reason.message
        : String(event.reason || 'unknown_error');
      setStatus('処理エラー\n' + reason);
    });

    bindEvents();
    init();
  </script>
</body>
</html>
