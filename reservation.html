<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lumière Nalu Reservation</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    body{
      margin:0;
      background:#000;
      color:#fff;
      font-family:"Times New Roman", serif;
      text-align:center;
      padding:32px 16px 40px;
    }

    .wrap{
      width:min(92vw, 420px);
      margin:0 auto;
    }

    .box{
      background:#0f0f0f;
      border:1px solid rgba(255,255,255,.08);
      border-radius:22px;
      padding:28px 22px;
      box-shadow:0 10px 30px rgba(0,0,0,.35);
    }

    .title{
      font-size:28px;
      margin:0 0 18px;
      letter-spacing:.08em;
    }

    .text{
      font-size:14px;
      line-height:1.9;
      opacity:.95;
      white-space:pre-wrap;
      margin:0 0 22px;
    }

    .memberInfo{
      font-size:13px;
      line-height:1.8;
      opacity:.9;
      margin:0 0 22px;
      white-space:pre-wrap;
    }

    .field{
      margin:0 0 16px;
      text-align:left;
    }

    .field label{
      display:block;
      font-size:13px;
      margin:0 0 8px;
      opacity:.9;
    }

    .field input,
    .field select,
    .field textarea{
      width:100%;
      box-sizing:border-box;
      background:#050505;
      color:#fff;
      border:1px solid rgba(255,255,255,.16);
      border-radius:14px;
      padding:12px 14px;
      font-size:14px;
      font-family:"Times New Roman", serif;
      outline:none;
    }

    .field textarea{
      min-height:88px;
      resize:vertical;
    }

    .field input::placeholder,
    .field textarea::placeholder{
      color:rgba(255,255,255,.45);
    }

    .button{
      display:inline-block;
      background:#fff;
      color:#000;
      border:none;
      border-radius:999px;
      padding:12px 24px;
      font-size:14px;
      font-family:"Times New Roman", serif;
      cursor:pointer;
      margin-top:8px;
    }

    .button:disabled{
      opacity:.6;
      cursor:not-allowed;
    }

    .status{
      margin-top:18px;
      font-size:14px;
      line-height:1.8;
      white-space:pre-wrap;
      opacity:.95;
    }

    .hidden{
      display:none;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="box">
      <h1 class="title">Reservation</h1>

      <p class="text">
Lumière Nalu ご予約申込ページです。

会員番号とお名前を確認のうえ
お申し込みを受け付けます。
      </p>

      <div id="memberInfo" class="memberInfo"></div>

      <div id="formArea" class="hidden">
        <div class="field">
          <label for="memberNo">会員番号</label>
          <input
            type="text"
            id="memberNo"
            placeholder="例：000001"
            inputmode="numeric"
          >
        </div>

        <div class="field">
          <label for="inputName">お名前</label>
          <input
            type="text"
            id="inputName"
            placeholder="お名前"
          >
        </div>

        <div class="field">
          <label for="serviceId">イベント / 店舗名</label>
          <select id="serviceId">
            <option value="">読み込み中...</option>
          </select>
        </div>

        <div class="field">
          <label for="people">人数</label>
          <select id="people">
            <option value="">選択してください</option>
            <option value="1">1名</option>
            <option value="2">2名</option>
            <option value="3">3名</option>
            <option value="4">4名</option>
          </select>
        </div>

        <div class="field">
          <label for="allergy">アレルギー</label>
          <textarea id="allergy" placeholder="ない場合は「なし」とご入力ください"></textarea>
        </div>

        <div class="field">
          <label for="dislike">苦手食材</label>
          <textarea id="dislike" placeholder="ない場合は「なし」とご入力ください"></textarea>
        </div>

        <div class="field">
          <label for="message">連絡事項</label>
          <textarea id="message" placeholder="ご希望や確認事項があればご入力ください"></textarea>
        </div>

        <button id="submitBtn" class="button">予約申込を送信する</button>
      </div>

      <div id="status" class="status">読み込み中...</div>
    </div>
  </div>

 <script>
  const LIFF_ID = "2007730715-wxTZ582n";
  const API_URL = "https://script.google.com/macros/s/AKfycbxOIqa-TOGIogMYIro9Qu0nG85vZ7ObLFT_YWLW3Q9XHbUmfbXVr9Oxk3zuUZxbtmXe/exec";
  const SOURCE = "lumiere";

  let currentProfile = null;
  let currentMember = null;

  async function initReservation() {
    const status = document.getElementById("status");
    const formArea = document.getElementById("formArea");
    const memberInfo = document.getElementById("memberInfo");
    const serviceSelect = document.getElementById("serviceId");

    try {
      status.textContent = "LIFF初期化中...";

      await liff.init({ liffId: LIFF_ID });

      if (!liff.isLoggedIn()) {
        status.textContent = "LINEログイン中...";
        liff.login();
        return;
      }

      status.textContent = "プロフィール取得中...";
      currentProfile = await liff.getProfile();

      status.textContent = "会員情報を確認中...";

      const res = await fetch(API_URL, {
        method: "POST",
        body: new URLSearchParams({
          action: "getReservationOptions",
          lineUserId: currentProfile.userId,
          source: SOURCE
        })
      });

      const data = await res.json();

      if (!data.ok) {
        status.textContent =
          "予約フォームを表示できませんでした。\n" +
          "エラー内容：" + (data.message || "unknown_error");
        return;
      }

      currentMember = data.member;

      memberInfo.textContent =
        "Member No. " + currentMember.memberNo + "\n" +
        "Rank： " + currentMember.rank + "\n" +
        "Name： " + (currentMember.cardName || currentMember.name);

      serviceSelect.innerHTML = "";

      const defaultOption = document.createElement("option");
      defaultOption.value = "";
      defaultOption.textContent = "選択してください";
      serviceSelect.appendChild(defaultOption);

      if (!data.services || data.services.length === 0) {
        const option = document.createElement("option");
        option.value = "";
        option.textContent = "現在選択可能な内容がありません";
        serviceSelect.appendChild(option);
      } else {
        data.services.forEach(function(service) {
          const option = document.createElement("option");
          option.value = service.serviceId;
          option.textContent = service.serviceName;
          serviceSelect.appendChild(option);
        });
      }

      formArea.classList.remove("hidden");
      status.textContent = "";

    } catch (e) {
      status.textContent =
        "読み込み中にエラーが発生しました。\n" +
        "エラー内容：" + e.message;
    }
  }

  async function submitReservation() {
    const status = document.getElementById("status");
    const btn = document.getElementById("submitBtn");

    const memberNo = document.getElementById("memberNo").value.trim();
    const inputName = document.getElementById("inputName").value.trim();
    const serviceId = document.getElementById("serviceId").value;
    const people = document.getElementById("people").value;
    const allergy = document.getElementById("allergy").value.trim();
    const dislike = document.getElementById("dislike").value.trim();
    const message = document.getElementById("message").value.trim();

    if (!currentProfile) {
      status.textContent = "LINEプロフィールを取得できていません。";
      return;
    }

    if (!memberNo) {
      status.textContent = "会員番号をご入力ください。";
      return;
    }

    if (!inputName) {
      status.textContent = "お名前をご入力ください。";
      return;
    }

    if (!serviceId) {
      status.textContent = "イベント / 店舗名を選択してください。";
      return;
    }

    if (!people) {
      status.textContent = "人数を選択してください。";
      return;
    }

    try {
      btn.disabled = true;
      btn.textContent = "送信中...";

      const res = await fetch(API_URL, {
        method: "POST",
        body: new URLSearchParams({
          action: "submitReservation",
          lineUserId: currentProfile.userId,
          displayName: currentProfile.displayName || "",
          source: SOURCE,
          memberNo: memberNo,
          inputName: inputName,
          serviceId: serviceId,
          people: people,
          allergy: allergy,
          dislike: dislike,
          message: message
        })
      });

      const data = await res.json();

      if (!data.ok) {
        if (data.message === "member_not_found") {
          status.textContent =
            "会員情報が確認できませんでした。\n会員証発行後にご利用ください。";
        } else if (data.message === "member_no_mismatch") {
          status.textContent =
            "会員番号が一致しません。\n会員証をご確認のうえ、再度お試しください。";
        } else if (data.message === "name_mismatch") {
          status.textContent =
            "お名前が会員情報と一致しません。\n会員証の表記をご確認ください。";
        } else if (data.message === "service_not_allowed") {
          status.textContent =
            "現在のランクでは、選択された内容にお申し込みいただけません。";
        } else {
          status.textContent =
            "予約申込を受け付けできませんでした。\n" +
            "エラー内容：" + (data.message || "unknown_error");
        }

        btn.disabled = false;
        btn.textContent = "予約申込を送信する";
        return;
      }

      status.textContent =
        "予約申込を受け付けました。\n内容を確認のうえ、運営よりご案内いたします。";

      btn.style.display = "none";

    } catch (e) {
      status.textContent =
        "予約申込を受け付けできませんでした。\n" +
        "エラー内容：" + e.message;

      btn.disabled = false;
      btn.textContent = "予約申込を送信する";
    }
  }

  document.addEventListener("DOMContentLoaded", function() {
    const btn = document.getElementById("submitBtn");

    if (btn) {
      btn.addEventListener("click", submitReservation);
    }

    initReservation();
  });
</script>
