<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nalu Check-in</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body{
      margin:0;
      background:#000;
      color:#fff;
      font-family:"Times New Roman", serif;
      padding:32px 20px;
      text-align:center;
    }
    .wrap{
      max-width:420px;
      margin:0 auto;
    }
    h1{
      margin-bottom:24px;
      font-weight:normal;
    }
    input{
      width:100%;
      box-sizing:border-box;
      padding:16px;
      font-size:18px;
      margin:16px 0;
      border-radius:12px;
      border:none;
    }
    button{
      width:100%;
      padding:16px;
      font-size:18px;
      border:none;
      border-radius:12px;
      background:#fff;
      color:#000;
      cursor:pointer;
    }
    .status{
      margin-top:20px;
      line-height:1.8;
      white-space:pre-wrap;
      font-size:16px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Nalu Check-in</h1>
    <input id="memberNo" type="text" placeholder="会員番号 例: 000123">
    <button id="plusBtn">来店 +1</button>
    <div id="status" class="status"></div>
  </div>

  <script>
    const LIFF_ID = "2007730715-HKGPwvvU";
    const API_URL = "https://script.google.com/macros/s/AKfycbxOIqa-TOGIogMYIro9Qu0nG85vZ7ObLFT_YWLW3Q9XHbUmfbXVr9Oxk3zuUZxbtmXe/exec";

    async function main() {
      await liff.init({ liffId: LIFF_ID });

      if (!liff.isLoggedIn()) {
        liff.login();
        return;
      }

      const profile = await liff.getProfile();

      document.getElementById("plusBtn").addEventListener("click", async () => {
        const memberNo = document.getElementById("memberNo").value.trim();
        const status = document.getElementById("status");

        if (!memberNo) {
          status.textContent = "会員番号を入力してください";
          return;
        }

        status.textContent = "更新中...";

        const callbackName = "jsonpCallback_" + Date.now();

        try {
          const data = await new Promise((resolve, reject) => {
            window[callbackName] = function(response) {
              resolve(response);
              delete window[callbackName];
              script.remove();
            };

            const script = document.createElement("script");
            script.src =
              API_URL +
              "?callback=" + callbackName +
              "&action=plusOne" +
              "&memberNo=" + encodeURIComponent(memberNo) +
              "&adminUserId=" + encodeURIComponent(profile.userId);

            script.onerror = function() {
              reject(new Error("更新に失敗しました"));
              delete window[callbackName];
              script.remove();
            };

            document.body.appendChild(script);
          });

          if (!data.ok) {
            status.textContent = data.message || "エラー";
            return;
          }

          status.textContent =
            "更新完了\n" +
            "会員番号: " + data.memberNo + "\n" +
            "名前: " + data.name + "\n" +
            "来店回数: " + data.visits;

        } catch (e) {
          status.textContent = String(e);
        }
      });
    }

    main();
  </script>
</body>
</html>
