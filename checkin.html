<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nalu Check-in</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    body{
      margin:0;
      background:#000;
      color:#fff;
      font-family:"Times New Roman", serif;
      padding:32px 20px;
      text-align:center;
    }

    .wrap{
      max-width:420px;
      margin:0 auto;
    }

    h1{
      margin-bottom:24px;
      font-weight:normal;
    }

    input{
      width:100%;
      box-sizing:border-box;
      padding:16px;
      font-size:18px;
      margin:16px 0;
      border-radius:12px;
      border:none;
    }

    button{
      width:100%;
      padding:16px;
      font-size:18px;
      border:none;
      border-radius:12px;
      background:#fff;
      color:#000;
      cursor:pointer;
    }

    button:disabled{
      opacity:.45;
      cursor:not-allowed;
    }

    .status{
      margin-top:20px;
      line-height:1.8;
      white-space:pre-wrap;
      font-size:16px;
    }

    .member-preview{
      margin-top:22px;
      padding:18px 16px;
      border:1px solid rgba(255,255,255,.14);
      border-radius:18px;
      background:rgba(255,255,255,.03);
      text-align:left;
      font-size:15px;
      line-height:1.9;
      display:none;
    }

    .member-preview .name{
      font-size:18px;
      margin-bottom:8px;
    }

    .member-preview .small{
      opacity:.75;
      font-size:13px;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <h1>Nalu Check-in</h1>

    <div id="liffStatus" class="status">LIFF初期化中...</div>

    <input id="memberNo" type="text" placeholder="会員番号 例: 000000">
    <div id="memberPreview" class="member-preview"></div>

    <button id="plusBtn" disabled>来店 +1</button>

    <div id="status" class="status"></div>
  </div>

  <script>
    const LIFF_ID = "2007730715-acunFUE6";
    const API_URL ="https://script.google.com/macros/s/AKfycbzuXAKRg9B5AuPOi2ppj9VuaN8qM01vzLlLnIBFjWiNnjKh7rxzmB_BEG2-U0qAMmM8/exec";
    let currentProfile = null;
    let checkinTimer = null;
    let currentMember = null;

    async function initLiff() {
  const liffStatus =
    document.getElementById("liffStatus");

  const plusBtn =
    document.getElementById("plusBtn");

  try {
    liffStatus.textContent =
      "LIFF初期化中...";

    await liff.init({
      liffId: LIFF_ID
    });

    console.log({
      isInClient: liff.isInClient(),
      isLoggedIn: liff.isLoggedIn()
    });

    if (!liff.isLoggedIn()) {
      liffStatus.textContent =
        "LINEログインへ移動します...";

      liff.login({
        redirectUri:
          "https://liff.line.me/" +
          LIFF_ID
      });

      return;
    }

    currentProfile =
      await liff.getProfile();

    liffStatus.textContent = "";
    plusBtn.disabled = false;

  } catch (err) {
    liffStatus.textContent =
      "LIFFの初期化に失敗しました。\n" +
      err.message;

    plusBtn.disabled = true;
  }
}

    document.getElementById("plusBtn").addEventListener("click", async function() {
      const memberNo = document.getElementById("memberNo").value.trim();
      const status = document.getElementById("status");

      if (!currentProfile || !currentProfile.userId) {
        status.textContent = "LINEユーザー情報を取得できていません。ページを開き直してください。";
        return;
      }

      if (!memberNo) {
        status.textContent = "会員番号を入力してください";
        return;
      }

      status.textContent = "更新中...";

      const callbackName = "jsonpCallback_" + Date.now();

      try {
        const data = await new Promise(function(resolve, reject) {
          const script = document.createElement("script");

          window[callbackName] = function(response) {
            resolve(response);
            delete window[callbackName];
            script.remove();
          };

          script.src =
            API_URL +
            "?callback=" + callbackName +
            "&action=plusOne" +
            "&memberNo=" + encodeURIComponent(memberNo) +
            "&adminUserId=" + encodeURIComponent(currentProfile.userId);

          script.onerror = function() {
            reject(new Error("更新に失敗しました"));
            delete window[callbackName];
            script.remove();
          };

          document.body.appendChild(script);
        });

        if (!data.ok) {
          status.textContent = data.message || "エラー";
          return;
        }

        status.textContent =
          "更新完了\n" +
          "会員番号: " + data.memberNo + "\n" +
          "名前: " + data.name + "\n" +
          "来店回数: " + data.visits;

        currentMember = null;
        loadMemberPreview(memberNo);

      } catch (e) {
        status.textContent = String(e);
      }
    });

    document.getElementById("memberNo").addEventListener("input", function() {
      const value = this.value.trim();

      currentMember = null;
      clearTimeout(checkinTimer);

      if (value.length < 6) {
        hideMemberPreview();
        return;
      }

      checkinTimer = setTimeout(function() {
        loadMemberPreview(value);
      }, 300);
    });

    async function loadMemberPreview(memberNo) {
  const preview = document.getElementById("memberPreview");

  preview.style.display = "block";
  preview.textContent = "会員情報を確認中...";

  try {
    const res = await fetch(API_URL, {
      method: "POST",
      body: new URLSearchParams({
        action: "getMemberForCheckin",
        memberNo: memberNo
      })
    });

    const data = await res.json();

    if (!data.ok) {
      currentMember = null;
      preview.innerHTML = "該当する会員が見つかりません。";
      return;
    }

    currentMember = data.member;

    preview.innerHTML =
      "<div class='name'>" + escapeHtml(data.member.name || "") + " 様</div>"
      + "<div>会員番号：" + escapeHtml(data.member.memberNo || "") + "</div>"
      + "<div>カナ：" + escapeHtml(data.member.kana || "") + "</div>"
      + "<div>ランク：" + escapeHtml(data.member.rank || "") + "</div>"
      + "<div>来店回数：" + escapeHtml(data.member.visitCount || "0") + "回</div>"
      + "<div>最終履歴：" + escapeHtml(data.member.lastVisit || "未記録") + "</div>"
      + "<div>誕生日：" + escapeHtml(data.member.birthday || "未登録") + "</div>"
      + "<div class='small'>LINE表示名：" + escapeHtml(data.member.displayName || "") + "</div>";

  } catch (err) {
    currentMember = null;
    preview.innerHTML =
      "会員情報の取得中にエラーが発生しました。<br>" +
      escapeHtml(err.message);
  }
}

    function hideMemberPreview() {
      const preview = document.getElementById("memberPreview");
      preview.style.display = "none";
      preview.innerHTML = "";
    }

    function escapeHtml(str) {
      return String(str)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    initLiff();
  </script>
</body>
</html>
