<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nalu-09 Admin</title>

  <style>
    body{
      margin:0;
      background:#000;
      color:#fff;
      font-family:"Times New Roman", serif;
      text-align:center;
      padding:32px 16px 40px;
    }

    .wrap{
      width:min(92vw, 420px);
      margin:0 auto;
    }

    .box{
      background:#0f0f0f;
      border:1px solid rgba(255,255,255,.08);
      border-radius:22px;
      padding:30px 22px;
      box-shadow:0 10px 30px rgba(0,0,0,.35);
    }

    .title{
      font-size:30px;
      letter-spacing:.12em;
      margin:0 0 10px;
    }

    .subtitle{
      font-size:14px;
      opacity:.72;
      margin:0 0 28px;
    }

    .menu{
      display:grid;
      gap:14px;
      margin-top:24px;
    }

    .menu button{
      width:100%;
      background:#fff;
      color:#000;
      border:none;
      border-radius:999px;
      padding:14px 18px;
      font-size:15px;
      font-family:"Times New Roman", serif;
      cursor:pointer;
    }

    .panel{
      display:none;
      text-align:left;
      margin-top:26px;
      padding-top:22px;
      border-top:1px solid rgba(255,255,255,.12);
      font-size:14px;
      line-height:1.9;
    }

    .panel.active{
      display:block;
    }

    .panel h2{
      font-size:18px;
      font-weight:normal;
      margin:0 0 14px;
      letter-spacing:.08em;
      text-align:center;
    }

    .summary-list,
    .service-list{
      display:grid;
      gap:14px;
      margin-top:18px;
    }

    .summary-date{
      font-size:15px;
      letter-spacing:.08em;
      text-align:center;
      margin:22px 0 8px;
      opacity:.9;
    }

    .summary-card,
    .reservation-card,
    .service-card{
      border:1px solid rgba(255,255,255,.14);
      border-radius:18px;
      padding:16px 14px;
      background:rgba(255,255,255,.03);
      font-size:13px;
      line-height:1.8;
    }

    .summary-card{
      cursor:pointer;
    }

    .service-name,
    .reservation-card .name{
      font-size:16px;
      margin-bottom:8px;
      letter-spacing:.04em;
    }

    .small{
      opacity:.72;
      font-size:12px;
    }

    .back-button{
      width:100%;
      background:transparent;
      color:#fff;
      border:1px solid rgba(255,255,255,.18);
      border-radius:999px;
      padding:12px 16px;
      font-size:14px;
      font-family:"Times New Roman", serif;
      margin-bottom:18px;
      cursor:pointer;
    }

    .detail-header{
      text-align:center;
      margin-bottom:16px;
    }

   .admin-input{
  display:block;
  width:100%;
  max-width:100%;
  min-width:0;
  box-sizing:border-box;
  margin:6px 0 12px;
  padding:11px 12px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,.18);
  background:#050505;
  color:#fff;
  font-size:16px;
  font-family:"Times New Roman", serif;
}

.service-card label{
  display:block;
  margin-top:10px;
  opacity:.85;
  font-size:13px;
}

    .save-button{
  width:100%;
  margin-top:14px;
  padding:12px 16px;
  border:none;
  border-radius:999px;
  background:#fff;
  color:#000;
  font-size:14px;
  font-family:"Times New Roman", serif;
  cursor:pointer;
}

    .service-card{
  box-sizing:border-box;
  overflow:hidden;
}

input[type="datetime-local"]{
  -webkit-appearance:none;
  appearance:none;
}
    
  </style>
</head>

<body>
  <div class="wrap">
    <div class="box">
      <h1 class="title">Nalu Admin</h1>
      <p class="subtitle">管理者メニュー</p>

      <div class="menu">
        <button onclick="location.href='checkin.html'">チェックイン</button>
        <button onclick="loadReservations()">予約管理</button>
        <button onclick="loadServiceSettings()">受付設定</button>
        <button onclick="showServiceManagement()">サービス管理</button>
      </div>

      <div id="reservation" class="panel">
        <h2>Reservation</h2>
        <div id="reservationList">読み込み前です。</div>
      </div>

      <div id="service" class="panel">
        <h2>Service Setting</h2>
        <div id="serviceList">読み込み前です。</div>
      </div>

      <div id="rank" class="panel">
  <h2>Service Management</h2>

  <div id="serviceManagementMenu" class="menu">
    <button onclick="showNewServiceForm()">新規サービス登録</button>
    <button onclick="loadServiceBasicEdit()">既存サービス修正</button>
  </div>

  <div id="newServiceArea" style="display:none;">
    <div class="service-card">
      <div class="service-name">新規サービス登録</div>

      <label>サービス名</label>
      <input id="newServiceName" class="admin-input" type="text" placeholder="例：Nalu Table">

      <label>表示先</label>
      <select id="newSource" class="admin-input">
        <option value="lumiere" selected>Lumière Nalu</option>
        <option value="event">Event</option>
      </select>

      <label>対象ランク</label>
      <select id="newRequiredRank" class="admin-input">
        <option value="WAVE">Wave</option>
        <option value="EVEIL">Eveil</option>
        <option value="ECLAT">Eclat</option>
        <option value="NALU">Nalu</option>
      </select>

      <label>受付状態</label>
      <select id="newStatus" class="admin-input">
        <option value="active" selected>受付中</option>
        <option value="paused">停止中</option>
      </select>

      <label>申込期限</label>
      <input id="newDeadline" class="admin-input" type="datetime-local">

      <label>上限人数</label>
      <input id="newCapacity" class="admin-input" type="number" placeholder="無制限の場合は空欄">

      <label>memo</label>
      <input id="newMemo" class="admin-input" type="text" placeholder="例：会員制フレンチ">

      <button class="save-button" onclick="addNewService()">
        登録する
      </button>
    </div>

    <div id="addServiceStatus" class="small"></div>
  </div>

  <div id="editServiceArea" style="display:none;">
    <div id="editServiceList">読み込み前です。</div>
  </div>
</div>
      
  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxOIqa-TOGIogMYIro9Qu0nG85vZ7ObLFT_YWLW3Q9XHbUmfbXVr9Oxk3zuUZxbtmXe/exec";

    let allReservations = [];

    function showPanel(id) {
      const panels = document.querySelectorAll(".panel");
      panels.forEach(function(panel) {
        panel.classList.remove("active");
      });

      const target = document.getElementById(id);
      if (target) {
        target.classList.add("active");
      }
    }

    async function loadReservations() {
      showPanel("reservation");

      const list = document.getElementById("reservationList");
      list.textContent = "予約履歴を読み込み中...";

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          body: new URLSearchParams({
            action: "getReservations"
          })
        });

        const data = await res.json();

        if (!data.ok) {
          list.textContent = "予約履歴を取得できませんでした。\n" + (data.message || "");
          return;
        }

        allReservations = data.reservations || [];

        if (allReservations.length === 0) {
          list.textContent = "現在、予約申込はありません。";
          return;
        }

        renderReservationSummary(allReservations);

      } catch (err) {
        list.textContent = "予約履歴の取得中にエラーが発生しました。\n" + err.message;
      }
    }

    function renderReservationSummary(reservations) {
      const list = document.getElementById("reservationList");
      const grouped = {};

      reservations.forEach(function(r) {
        const date = r.eventDate || getReservationDate(r.createdAt);
        const serviceName = r.serviceName || "未設定";
        const key = date + "___" + serviceName;

        if (!grouped[key]) {
          grouped[key] = {
            date: date,
            serviceName: serviceName,
            reservations: [],
            totalPeople: 0,
            noteCount: 0,
            allergyCount: 0,
            dislikeCount: 0
          };
        }

        grouped[key].reservations.push(r);
        grouped[key].totalPeople += Number(r.people || 0);

        if (hasText(r.message)) grouped[key].noteCount += 1;
        if (hasText(r.allergy)) grouped[key].allergyCount += 1;
        if (hasText(r.dislike)) grouped[key].dislikeCount += 1;
      });

      const groups = Object.values(grouped);

      groups.sort(function(a, b) {
        return b.date.localeCompare(a.date);
      });

      window.reservationGroups = groups;

      let html = `<div class="summary-list">`;
      let currentDate = "";

      groups.forEach(function(group, index) {
        if (group.date !== currentDate) {
          currentDate = group.date;
          html += `<div class="summary-date">${escapeHtml(currentDate)}</div>`;
        }

        html += `
          <div class="summary-card" onclick="renderReservationDetail(${index})">
            <div class="service-name">${escapeHtml(group.serviceName)}</div>
            <div>申込件数：${group.reservations.length}件</div>
            <div>人数合計：${group.totalPeople}名</div>
            <div>備考あり：${group.noteCount}件</div>
            <div>アレルギーあり：${group.allergyCount}件</div>
            <div>苦手食材あり：${group.dislikeCount}件</div>
          </div>
        `;
      });

      html += `</div>`;
      list.innerHTML = html;
    }

    function renderReservationDetail(index) {
      const list = document.getElementById("reservationList");
      const group = window.reservationGroups[index];

      if (!group) {
        list.textContent = "詳細を表示できませんでした。";
        return;
      }

      let html = `
        <button class="back-button" onclick="renderReservationSummary(allReservations)">一覧に戻る</button>

        <div class="detail-header">
          <div>${escapeHtml(group.date)}</div>
          <div>${escapeHtml(group.serviceName)}</div>
          <div>人数合計：${group.totalPeople}名 / 申込：${group.reservations.length}件</div>
        </div>

        <div class="summary-list">
      `;

      group.reservations.forEach(function(r) {
        html += `
          <div class="reservation-card">
            <div class="name">${escapeHtml(r.name || "")} 様</div>
            <div>申込内容：${escapeHtml(r.serviceName || "")}</div>
            <div>人数：${escapeHtml(String(r.people || ""))}名</div>
            <div>会員番号：${escapeHtml(formatMemberNo(r.memberNo))}</div>
            <div>ランク：${escapeHtml(r.rank || "")}</div>
            <div>カナ：${escapeHtml(r.kana || "")}</div>
            <div>同行者：${escapeHtml(r.companionName || "なし")}</div>
            <div>アレルギー：${escapeHtml(r.allergy || "なし")}</div>
            <div>苦手食材：${escapeHtml(r.dislike || "なし")}</div>
            <div>連絡事項：${escapeHtml(r.message || "なし")}</div>
            <div>ステータス：${escapeHtml(r.status || "")}</div>
            <div class="small">申込日時：${escapeHtml(r.createdAt || "")}</div>
          </div>
        `;
      });

      html += `</div>`;
      list.innerHTML = html;
    }

    async function loadServiceSettings() {
  showPanel("service");

  const list = document.getElementById("serviceList");
  list.textContent = "受付設定を読み込み中...";

  try {
    const res = await fetch(API_URL, {
      method: "POST",
      body: new URLSearchParams({
        action: "getAdminServices"
      })
    });

    const data = await res.json();

    if (!data.ok) {
      list.textContent = "受付設定を取得できませんでした。\n" + (data.message || "");
      return;
    }

    const services = data.services || [];

    if (services.length === 0) {
      list.textContent = "登録されているサービスはありません。";
      return;
    }

    let html = "";

    services.forEach(function(s) {
      const serviceId = escapeHtml(s.serviceId);
      const statusActive = s.status === "active" ? "selected" : "";
      const statusPaused = s.status === "paused" ? "selected" : "";
      const deadlineValue = toDateTimeLocalValue(s.deadline);

      html += ""
        + "<div class='service-card'>"
        + "<div class='service-name'>" + escapeHtml(s.serviceName) + "</div>"

        + "<label>受付状態</label>"
        + "<select id='status-" + serviceId + "' class='admin-input'>"
        + "<option value='active' " + statusActive + ">受付中</option>"
        + "<option value='paused' " + statusPaused + ">停止中</option>"
        + "</select>"

        + "<label>申込期限</label>"
        + "<input id='deadline-" + serviceId + "' class='admin-input' type='datetime-local' value='" + escapeHtml(deadlineValue) + "'>"

        + "<label>上限人数</label>"
        + "<input id='capacity-" + serviceId + "' class='admin-input' type='number' value='" + escapeHtml(s.capacity || "") + "' placeholder='無制限の場合は空欄'>"

        + "<div class='small'>表示元：" + escapeHtml(s.source) + "</div>"
        + "<div class='small'>対象ランク：" + escapeHtml(s.requiredRank) + "</div>"
        + "<div class='small'>service_id：" + serviceId + "</div>"
        + "<div class='small'>memo：" + escapeHtml(s.memo || "") + "</div>"

        + "<button class='save-button service-save-button' data-service-id='" + serviceId + "'>設定を保存</button>"
        + "</div>";
    });

    list.innerHTML = html;

    const buttons = document.querySelectorAll(".service-save-button");

    buttons.forEach(function(button) {
      button.addEventListener("click", function() {
        const serviceId = button.getAttribute("data-service-id");
        saveServiceSetting(serviceId);
      });
    });

  } catch (err) {
    list.textContent = "受付設定の取得中にエラーが発生しました。\n" + err.message;
  }
}
    
    function getReservationDate(value) {
      if (!value) return "日付未設定";

      const str = String(value);

      if (str.includes(" ")) {
        return str.split(" ")[0];
      }

      return str;
    }

    function hasText(value) {
      if (value === null || value === undefined) return false;

      const text = String(value)
        .replace(/\s/g, "")
        .trim();

      if (!text) return false;
      if (text === "なし") return false;
      if (text === "-") return false;
      if (text === "無し") return false;
      if (text === "特になし") return false;

      return true;
    }

    function formatMemberNo(value) {
      if (value === null || value === undefined || value === "") {
        return "";
      }

      return String(value).padStart(6, "0");
    }

    function escapeHtml(str) {
      return String(str)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }
    
   function fromDateTimeLocalValue(value) {
  if (!value) return "";

  return String(value).replace("T", " ").replaceAll("-", "/");
}
    
  function toDateTimeLocalValue(value) {
  if (!value) return "";

  const str = String(value).trim();

  if (str.includes("/") && str.includes(" ")) {
    return str.replaceAll("/", "-").replace(" ", "T").slice(0, 16);
  }

  if (str.includes("-") && str.includes(" ")) {
    return str.replace(" ", "T").slice(0, 16);
  }

  if (str.includes("T")) {
    return str.slice(0, 16);
  }

  return "";
}

    
    async function saveServiceSetting(serviceId) {
  const statusEl = document.getElementById("status-" + serviceId);
  const deadlineEl = document.getElementById("deadline-" + serviceId);
  const capacityEl = document.getElementById("capacity-" + serviceId);

  if (!statusEl || !deadlineEl || !capacityEl) {
    alert("入力欄が見つかりません。");
    return;
  }

  const status = statusEl.value;
  const deadline = fromDateTimeLocalValue(deadlineEl.value);
  const capacity = capacityEl.value;

  try {
    const res = await fetch(API_URL, {
      method: "POST",
      body: new URLSearchParams({
        action: "updateServiceSetting",
        serviceId: serviceId,
        status: status,
        deadline: deadline,
        capacity: capacity
      })
    });

    const data = await res.json();

    if (!data.ok) {
      alert("保存できませんでした：" + (data.message || ""));
      return;
    }

    alert("設定を保存しました");
    loadServiceSettings();

  } catch (err) {
    alert("保存中にエラーが発生しました：" + err.message);
  }
}

    async function addNewService() {
  const serviceName = document.getElementById("newServiceName").value.trim();
  const source = document.getElementById("newSource").value;
  const requiredRank = document.getElementById("newRequiredRank").value;
  const status = document.getElementById("newStatus").value;
  const deadline = fromDateTimeLocalValue(document.getElementById("newDeadline").value);
  const capacity = document.getElementById("newCapacity").value;
  const memo = document.getElementById("newMemo").value.trim();
  const statusArea = document.getElementById("addServiceStatus");

  if (!serviceName) {
    alert("サービス名を入力してください。");
    return;
  }

  try {
    statusArea.textContent = "登録中...";

    const res = await fetch(API_URL, {
      method: "POST",
      body: new URLSearchParams({
        action: "addNewService",
        serviceName: serviceName,
        source: source,
        requiredRank: requiredRank,
        status: status,
        deadline: deadline,
        capacity: capacity,
        memo: memo
      })
    });

    const data = await res.json();

    if (!data.ok) {
      statusArea.textContent = "";
      alert("登録できませんでした：" + (data.message || ""));
      return;
    }

    statusArea.textContent =
      "登録しました。service_id：" + data.serviceId;

    document.getElementById("newServiceName").value = "";
    document.getElementById("newSource").value = "lumiere";
    document.getElementById("newRequiredRank").value = "WAVE";
    document.getElementById("newStatus").value = "active";
    document.getElementById("newDeadline").value = "";
    document.getElementById("newCapacity").value = "";
    document.getElementById("newMemo").value = "";

  } catch (err) {
    statusArea.textContent = "";
    alert("登録中にエラーが発生しました：" + err.message);
  }
}

    function showServiceManagement() {
  showPanel("rank");

  document.getElementById("serviceManagementMenu").style.display = "grid";
  document.getElementById("newServiceArea").style.display = "none";
  document.getElementById("editServiceArea").style.display = "none";
}

function showNewServiceForm() {
  document.getElementById("newServiceArea").style.display = "block";
  document.getElementById("editServiceArea").style.display = "none";
}

    document.getElementById("newStatus").value = "active";

  } catch (err) {

async function loadServiceBasicEdit() {
  document.getElementById("newServiceArea").style.display = "none";
  document.getElementById("editServiceArea").style.display = "block";

  const list = document.getElementById("editServiceList");
  list.textContent = "既存サービスを読み込み中...";

  try {
    const res = await fetch(API_URL, {
      method: "POST",
      body: new URLSearchParams({
        action: "getAdminServices"
      })
    });

    const data = await res.json();

    if (!data.ok) {
      list.textContent = "既存サービスを取得できませんでした。\n" + (data.message || "");
      return;
    }

    const services = data.services || [];

    if (services.length === 0) {
      list.textContent = "登録されているサービスはありません。";
      return;
    }

    let html = "";

    services.forEach(function(s) {
      const serviceId = escapeHtml(s.serviceId);

      const sourceLumiere = s.source === "lumiere" ? "selected" : "";
      const sourceEvent = s.source === "event" ? "selected" : "";

      const rankWave = s.requiredRank === "WAVE" ? "selected" : "";
      const rankEveil = s.requiredRank === "Eveil" ? "selected" : "";
      const rankEclat = s.requiredRank === "ECLAT" ? "selected" : "";
      const rankNalu = s.requiredRank === "Nalu" ? "selected" : "";

      html += ""
        + "<div class='service-card'>"
        + "<div class='service-name'>" + escapeHtml(s.serviceName) + "</div>"

        + "<label>サービス名</label>"
        + "<input id='editName-" + serviceId + "' class='admin-input' type='text' value='" + escapeHtml(s.serviceName) + "'>"

        + "<label>表示先</label>"
        + "<select id='editSource-" + serviceId + "' class='admin-input'>"
        + "<option value='lumiere' " + sourceLumiere + ">Lumière Nalu</option>"
        + "<option value='event' " + sourceEvent + ">Event</option>"
        + "</select>"

        + "<label>対象ランク</label>"
        + "<select id='editRank-" + serviceId + "' class='admin-input'>"
        + "<option value='WAVE' " + rankWave + ">WAVE</option>"
        + "<option value='Eveil' " + rankEveil + ">Eveil</option>"
        + "<option value='ECLAT' " + rankEclat + ">ECLAT</option>"
        + "<option value='Nalu' " + rankNalu + ">Nalu</option>"
        + "</select>"

        + "<label>memo</label>"
        + "<input id='editMemo-" + serviceId + "' class='admin-input' type='text' value='" + escapeHtml(s.memo || "") + "'>"

        + "<div class='small'>service_id：" + serviceId + "</div>"
        + "<div class='small'>受付状態・期限・上限人数は「受付設定」で変更</div>"

        + "<button class='save-button service-basic-save-button' data-service-id='" + serviceId + "'>変更を保存する</button>"
        + "</div>";
    });

    list.innerHTML = html;

    const buttons = document.querySelectorAll(".service-basic-save-button");

    buttons.forEach(function(button) {
      button.addEventListener("click", function() {
        const serviceId = button.getAttribute("data-service-id");
        saveServiceBasic(serviceId);
      });
    });

  } catch (err) {
    list.textContent = "既存サービスの取得中にエラーが発生しました。\n" + err.message;
  }
}

async function saveServiceBasic(serviceId) {
  const nameEl = document.getElementById("editName-" + serviceId);
  const sourceEl = document.getElementById("editSource-" + serviceId);
  const rankEl = document.getElementById("editRank-" + serviceId);
  const memoEl = document.getElementById("editMemo-" + serviceId);

  if (!nameEl || !sourceEl || !rankEl || !memoEl) {
    alert("入力欄が見つかりません。");
    return;
  }

  const serviceName = nameEl.value.trim();
  const source = sourceEl.value;
  const requiredRank = rankEl.value;
  const memo = memoEl.value.trim();

  if (!serviceName) {
    alert("サービス名を入力してください。");
    return;
  }

  try {
    const res = await fetch(API_URL, {
      method: "POST",
      body: new URLSearchParams({
        action: "updateServiceBasic",
        serviceId: serviceId,
        serviceName: serviceName,
        source: source,
        requiredRank: requiredRank,
        memo: memo
      })
    });

    const data = await res.json();

    if (!data.ok) {
      alert("保存できませんでした：" + (data.message || ""));
      return;
    }

    alert("変更を保存しました");
    loadServiceBasicEdit();

  } catch (err) {
    alert("保存中にエラーが発生しました：" + err.message);
  }
}
    
  </script>
</body>
