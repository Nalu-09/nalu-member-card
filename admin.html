<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nalu-09 Admin</title>

  <style>
    body{
      margin:0;
      background:#000;
      color:#fff;
      font-family:"Times New Roman", serif;
      text-align:center;
      padding:32px 16px 40px;
    }

    .wrap{
      width:min(92vw, 420px);
      margin:0 auto;
    }

    .box{
      background:#0f0f0f;
      border:1px solid rgba(255,255,255,.08);
      border-radius:22px;
      padding:30px 22px;
      box-shadow:0 10px 30px rgba(0,0,0,.35);
    }

    .title{
      font-size:30px;
      letter-spacing:.12em;
      margin:0 0 10px;
    }

    .subtitle{
      font-size:14px;
      opacity:.72;
      margin:0 0 28px;
    }

    .menu{
      display:grid;
      gap:14px;
      margin-top:24px;
    }

    .menu button{
      width:100%;
      background:#fff;
      color:#000;
      border:none;
      border-radius:999px;
      padding:14px 18px;
      font-size:15px;
      font-family:"Times New Roman", serif;
      cursor:pointer;
    }

    .menu button.secondary{
      background:transparent;
      color:#fff;
      border:1px solid rgba(255,255,255,.18);
    }

    .panel{
      display:none;
      text-align:left;
      margin-top:26px;
      padding-top:22px;
      border-top:1px solid rgba(255,255,255,.12);
      font-size:14px;
      line-height:1.9;
    }

    .panel.active{
      display:block;
    }

    .panel h2{
      font-size:18px;
      font-weight:normal;
      margin:0 0 14px;
      letter-spacing:.08em;
      text-align:center;
    }

    .status{
      margin-top:20px;
      font-size:14px;
      line-height:1.8;
      white-space:pre-wrap;
      opacity:.9;
    }

    .reservation-list{
  display:grid;
  gap:14px;
  margin-top:18px;
}

.reservation-card{
  border:1px solid rgba(255,255,255,.14);
  border-radius:18px;
  padding:16px 14px;
  background:rgba(255,255,255,.03);
  font-size:13px;
  line-height:1.8;
}

.reservation-card .name{
  font-size:16px;
  margin-bottom:6px;
}

.reservation-card .status{
  opacity:.85;
  margin-top:8px;
}

.reservation-card .small{
  opacity:.72;
  font-size:12px;
}

    .summary-list{
  display:grid;
  gap:14px;
  margin-top:18px;
}

.summary-date{
  font-size:15px;
  letter-spacing:.08em;
  text-align:center;
  margin:22px 0 8px;
  opacity:.9;
}

.summary-card{
  border:1px solid rgba(255,255,255,.14);
  border-radius:18px;
  padding:16px 14px;
  background:rgba(255,255,255,.03);
  font-size:13px;
  line-height:1.8;
  cursor:pointer;
}

.summary-card .service-name{
  font-size:16px;
  margin-bottom:8px;
  letter-spacing:.04em;
}

.summary-card .meta{
  opacity:.82;
}

.detail-header{
  text-align:center;
  margin-bottom:16px;
}

.back-button{
  width:100%;
  background:transparent;
  color:#fff;
  border:1px solid rgba(255,255,255,.18);
  border-radius:999px;
  padding:12px 16px;
  font-size:14px;
  font-family:"Times New Roman", serif;
  margin-bottom:18px;
  cursor:pointer;
}

    .service-list{
  display:grid;
  gap:14px;
  margin-top:18px;
}

.service-card{
  border:1px solid rgba(255,255,255,.14);
  border-radius:18px;
  padding:16px 14px;
  background:rgba(255,255,255,.03);
  font-size:13px;
  line-height:1.8;
}

.service-card .service-name{
  font-size:16px;
  margin-bottom:8px;
  letter-spacing:.04em;
}

.service-card .status-active{
  color:#fff;
}

.service-card .status-paused{
  opacity:.6;
}

.service-card .small{
  opacity:.72;
  font-size:12px;
}

    .admin-input{
  width:100%;
  box-sizing:border-box;
  margin:6px 0 12px;
  padding:11px 12px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,.18);
  background:#050505;
  color:#fff;
  font-size:14px;
  font-family:"Times New Roman", serif;
}

.service-card label{
  display:block;
  margin-top:10px;
  opacity:.85;
  font-size:13px;
}

.save-button{
  width:100%;
  margin-top:14px;
  padding:12px 16px;
  border:none;
  border-radius:999px;
  background:#fff;
  color:#000;
  font-size:14px;
  font-family:"Times New Roman", serif;
  cursor:pointer;
}
    
  </style>
</head>

<body>
  <div class="wrap">
    <div class="box">
      <h1 class="title">Nalu Admin</h1>
      <p class="subtitle">管理者メニュー</p>

      <div class="menu">
        <button onclick="location.href='checkin.html'">チェックイン</button>
        <button onclick="loadReservations()">予約管理</button>
        <button onclick="loadServiceSettings()">受付設定</button>
        <button onclick="showPanel('rank')">ランク設定</button>
      </div>

      <div id="checkin" class="panel">
        <h2>Check-in</h2>
        <p>
          会員番号を入力して、来店回数を更新する画面です。<br>
          次の段階で、既存のチェックイン処理をここに接続します。
        </p>
      </div>

    <div id="reservation" class="panel">
  <h2>Reservation</h2>

  <div id="reservationList" class="reservation-list">
    読み込み前です。
  </div>
</div>

      <div id="service" class="panel">
  <h2>Service Setting</h2>

  <div id="serviceList" class="service-list">
    読み込み前です。
  </div>
</div>
      
      <div id="rank" class="panel">
        <h2>Rank Setting</h2>
        <p>
          ランク別の表示条件を設定する画面です。<br>
          required_rank を変更し、予約フォーム側へ反映します。
        </p>
      </div>

      <div id="status" class="status"></div>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxOIqa-TOGIogMYIro9Qu0nG85vZ7ObLFT_YWLW3Q9XHbUmfbXVr9Oxk3zuUZxbtmXe/exec";
    let allReservations = [];

async function loadReservations() {
  showPanel("reservation");

  const list = document.getElementById("reservationList");
  list.textContent = "予約履歴を読み込み中...";

  try {
    const res = await fetch(API_URL, {
      method: "POST",
      body: new URLSearchParams({
        action: "getReservations"
      })
    });

    const data = await res.json();

    if (!data.ok) {
      list.textContent = "予約履歴を取得できませんでした。\n" + (data.message || "");
      return;
    }

    allReservations = data.reservations || [];

    if (allReservations.length === 0) {
      list.textContent = "現在、予約申込はありません。";
      return;
    }

    renderReservationSummary(allReservations);

  } catch (err) {
    list.textContent = "予約履歴の取得中にエラーが発生しました。\n" + err.message;
  }
}
function escapeHtml(str) {
  return String(str)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function formatMemberNo(value) {
  if (value === null || value === undefined || value === "") {
    return "";
  }

  return String(value).padStart(6, "0");
}
    
    function showPanel(id) {
      const panels = document.querySelectorAll(".panel");

      panels.forEach(function(panel) {
        panel.classList.remove("active");
      });

      const target = document.getElementById(id);

      if (target) {
        target.classList.add("active");
      }
    }
    function renderReservationSummary(reservations) {
  const list = document.getElementById("reservationList");

  const grouped = {};

  reservations.forEach(function(r) {
    const date = getReservationDate(r.createdAt);
    const serviceName = r.serviceName || "未設定";

    const key = date + "___" + serviceName;

    if (!grouped[key]) {
      grouped[key] = {
        date: date,
        serviceName: serviceName,
        reservations: [],
        totalPeople: 0,
        noteCount: 0,
        allergyCount: 0,
        dislikeCount: 0
      };
    }

    grouped[key].reservations.push(r);
    grouped[key].totalPeople += Number(r.people || 0);

    if (hasText(r.message)) grouped[key].noteCount += 1;
    if (hasText(r.allergy) && r.allergy !== "なし") grouped[key].allergyCount += 1;
    if (hasText(r.dislike) && r.dislike !== "なし") grouped[key].dislikeCount += 1;
  });

  const groups = Object.values(grouped);

  groups.sort(function(a, b) {
    return b.date.localeCompare(a.date);
  });

  let html = `<div class="summary-list">`;

  let currentDate = "";

  groups.forEach(function(group, index) {
    if (group.date !== currentDate) {
      currentDate = group.date;
      html += `<div class="summary-date">${escapeHtml(currentDate)}</div>`;
    }

    html += `
      <div class="summary-card" onclick="renderReservationDetail(${index})">
        <div class="service-name">${escapeHtml(group.serviceName)}</div>
        <div class="meta">申込件数：${group.reservations.length}件</div>
        <div class="meta">人数合計：${group.totalPeople}名</div>
        <div class="meta">アレルギーあり：${group.allergyCount}件</div>
        <div class="meta">苦手食材あり：${group.dislikeCount}件</div>
        <div class="meta">備考あり：${group.noteCount}件</div>
      </div>
    `;
  });

  html += `</div>`;

  list.innerHTML = html;

  window.reservationGroups = groups;
}

function renderReservationDetail(index) {
  const list = document.getElementById("reservationList");
  const group = window.reservationGroups[index];

  if (!group) {
    list.textContent = "詳細を表示できませんでした。";
    return;
  }

  let html = `
    <button class="back-button" onclick="renderReservationSummary(allReservations)">一覧に戻る</button>

    <div class="detail-header">
      <div>${escapeHtml(group.date)}</div>
      <div>${escapeHtml(group.serviceName)}</div>
      <div>人数合計：${group.totalPeople}名 / 申込：${group.reservations.length}件</div>
    </div>

    <div class="reservation-list">
  `;

  group.reservations.forEach(function(r) {
    html += `
      <div class="reservation-card">
        <div class="name">${escapeHtml(r.name || "")} 様</div>
        <div>申込内容：${escapeHtml(r.serviceName || "")}</div>
        <div>人数：${escapeHtml(String(r.people || ""))}名</div>
        <div>会員番号：${escapeHtml(formatMemberNo(r.memberNo))}</div>
        <div>ランク：${escapeHtml(r.rank || "")}</div>
        <div>カナ：${escapeHtml(r.kana || "")}</div>
        <div>同行者：${escapeHtml(r.companionName || "なし")}</div>
        <div>アレルギー：${escapeHtml(r.allergy || "なし")}</div>
        <div>苦手食材：${escapeHtml(r.dislike || "なし")}</div>
        <div>連絡事項：${escapeHtml(r.message || "なし")}</div>
        <div class="status">ステータス：${escapeHtml(r.status || "")}</div>
        <div class="small">申込日時：${escapeHtml(r.createdAt || "")}</div>
      </div>
    `;
  });

  html += `</div>`;

  list.innerHTML = html;
}

function getReservationDate(value) {
  if (!value) return "日付未設定";

  const str = String(value);

  if (str.includes(" ")) {
    return str.split(" ")[0];
  }

  return str;
}

function hasText(value) {
  if (value === null || value === undefined) return false;

  const text = String(value).trim();

  if (!text) return false;
  if (text === "なし") return false;
  if (text === "-") return false;

  return true;
}

    async function loadServiceSettings() {
  showPanel("service");

  const list = document.getElementById("serviceList");
  list.textContent = "受付設定を読み込み中...";

  try {
    const res = await fetch(API_URL, {
      method: "POST",
      body: new URLSearchParams({
        action: "getAdminServices"
      })
    });

    const data = await res.json();

    if (!data.ok) {
      list.textContent = "受付設定を取得できませんでした。\n" + (data.message || "");
      return;
    }

    const services = data.services || [];

    if (services.length === 0) {
      list.textContent = "登録されているサービスはありません。";
      return;
    }

    list.innerHTML = services.map(function(s) {
      const statusClass = s.status === "active" ? "status-active" : "status-paused";
      const statusLabel = s.status === "active" ? "受付中" : "停止中";

     return `
  <div class="service-card">
    <div class="service-name">${escapeHtml(s.serviceName)}</div>

    <label>受付状態</label>
    <select id="status-${s.serviceId}" class="admin-input">
      <option value="active" ${s.status === "active" ? "selected" : ""}>受付中</option>
      <option value="paused" ${s.status === "paused" ? "selected" : ""}>停止中</option>
    </select>

    <label>申込期限</label>
    <input
      id="deadline-${s.serviceId}"
      class="admin-input"
      type="text"
      value="${escapeHtml(s.deadline || "")}"
      placeholder="例：2026/07/10 23:59"
    >

    <label>上限人数</label>
    <input
      id="capacity-${s.serviceId}"
      class="admin-input"
      type="number"
      value="${escapeHtml(s.capacity || "")}"
      placeholder="無制限の場合は空欄"
    >

    <div class="small">表示元：${escapeHtml(s.source)}</div>
    <div class="small">対象ランク：${escapeHtml(s.requiredRank)}</div>
    <div class="small">service_id：${escapeHtml(s.serviceId)}</div>
    <div class="small">memo：${escapeHtml(s.memo || "")}</div>

    <button class="save-button" onclick="saveServiceSetting('${s.serviceId}')">
      保存
    </button>
  </div>
`;
    
  </script>
</body>
</html>
