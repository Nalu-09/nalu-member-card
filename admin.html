    .back-button{

    .service-card label{

      border-radius:999px;
      background:#fff;
      color:#000;
      font-size:14px;
      font-family:"Times New Roman", serif;
      cursor:pointer;

    input[type="datetime-local"]{
      -webkit-appearance:none;
      appearance:none;
    }

    .status-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:14px;
}

.status-button{
  width:100%;
  border:none;
  border-radius:999px;
  padding:11px 10px;
  font-size:13px;
  font-family:"Times New Roman", serif;
  cursor:pointer;
}

.status-attended{

  color:#000;
}

.status-cancelled{
  background:transparent;

}

.status-button:disabled{

}

.status-result{

  opacity:.75;
}

@media (max-width:767px){
  .status-actions{
    grid-template-columns:1fr;

  background:rgba(0,0,0,.82);

.receipt-modal-box{

.receipt-cancel-button,

  <script>
    const API_URL =
  "https://script.google.com/macros/s/AKfycbzuXAKRg9B5AuPOi2ppj9VuaN8qM01vzLlLnIBFjWiNnjKh7rxzmB_BEG2-U0qAMmM8/exec";
    
    const ADMIN_LIFF_ID =
  "2007730715-4C6HARac";

let currentAdminAuth = null;
let currentAdminIdToken = "";

    let allReservations = [];
    window.reservationGroups = [];

    function showPanel(id) {
      const panels = document.querySelectorAll(".panel");

      panels.forEach(function(panel) {
        panel.classList.remove("active");
      });

      const target = document.getElementById(id);

      if (target) {
        target.classList.add("active");
      }
    }

    function showReservationSettings() {
  showPanel("service");

  const menu =
    document.getElementById(
      "reservationSettingMenu"
    );

  const newArea =
    document.getElementById(
      "newReservationArea"
    );

  const editArea =
    document.getElementById(
      "editReservationArea"
    );

  if (menu) {
    menu.style.display = "grid";
  }

  if (newArea) {
    newArea.style.display = "none";
  }

  if (editArea) {
    editArea.style.display = "none";
  }
}


let adminNewReservationState = {
  members: [],
  services: [],
  selectedMember: null,
  selectedService: null,
  selectedEvent: null
};

    async function showAdminNewEvent() {
  showPanel("service");

  const newArea =
    document.getElementById(
      "newReservationArea"
    );

  const editArea =
    document.getElementById(
      "editReservationArea"
    );

  if (editArea) {
    editArea.style.display =
      "none";
  }

  if (!newArea) {
    return;
  }

  newArea.style.display =
    "block";

  newArea.innerHTML =
    "<div class='service-card'>" +
    "<div class='service-name'>" +
    "新規受付登録" +
    "</div>" +
    "<div class='small'>" +
    "サービス情報を読み込み中..." +
    "</div>" +
    "</div>";


  try {
    const response =
      await fetch(
        API_URL,
        {
          method: "POST",

          body:
            new URLSearchParams({
              action:
                "getAdminEventFormData",

              idToken:
                currentAdminIdToken
            })
        }
      );


    const data =
      await response.json();


    if (!data.ok) {
      throw new Error(
        data.message ||
        "サービス情報を取得できませんでした。"
      );
    }


    renderAdminNewEventForm(
      data.services || []
    );


  } catch (error) {
    newArea.innerHTML =
      "<div class='service-card'>" +
      "<div class='service-name'>" +
      "新規受付登録" +
      "</div>" +
      "<div class='small'>" +
      escapeHtml(
        "取得できませんでした：" +
        error.message
      ) +
      "</div>" +
      "</div>";
  }
}


function renderAdminNewEventForm(
  services
) {
  const area =
    document.getElementById(
      "newReservationArea"
    );

  if (!area) {
    return;
  }


  let serviceOptions =
    "<option value=''>" +
    "イベントを選択してください" +
    "</option>";


  services.forEach(
    function(service) {
      serviceOptions +=
        "<option value='" +
        escapeHtml(
          service.serviceId || ""
        ) +
        "'>" +
        escapeHtml(
          service.serviceName ||
          service.serviceId ||
          ""
        ) +
        "</option>";
    }
  );


  area.innerHTML =
    "<div class='service-card'>" +

    "<div class='service-name'>" +
    "新規受付登録" +
    "</div>" +


    "<label>イベント名</label>" +

    "<select" +
    " id='adminEventService'" +
    " class='admin-input'>" +

    serviceOptions +

    "</select>" +


    "<label>開催日</label>" +

    "<input" +
    " id='adminEventDate'" +
    " class='admin-input'" +
    " type='date'>" +


    "<label>開始時間</label>" +

    "<input" +
    " id='adminEventStartTime'" +
    " class='admin-input'" +
    " type='time'>" +


    "<label>終了時間</label>" +

    "<input" +
    " id='adminEventEndTime'" +
    " class='admin-input'" +
    " type='time'>" +


    "<label>定員人数</label>" +

    "<input" +
    " id='adminEventCapacity'" +
    " class='admin-input'" +
    " type='number'" +
    " min='1'" +
    " inputmode='numeric'" +
    " placeholder='例：8'>" +


    "<label>予約受付開始日</label>" +

    "<input" +
    " id='adminEventReservationStart'" +
    " class='admin-input'" +
    " type='date'>" +


    "<label>予約受付終了日</label>" +

    "<input" +
    " id='adminEventReservationEnd'" +
    " class='admin-input'" +
    " type='date'>" +


    "<button" +
    " id='adminEventSubmitButton'" +
    " class='save-button'" +
    " type='button'" +
    " onclick='submitAdminNewEvent()'>" +

    "受付を登録する" +

    "</button>" +


    "<div" +
    " id='adminEventStatus'" +
    " class='status-result'>" +
    "</div>" +

    "</div>";
}


async function submitAdminNewEvent() {
  const serviceSelect =
    document.getElementById(
      "adminEventService"
    );

  const eventDateInput =
    document.getElementById(
      "adminEventDate"
    );

  const startTimeInput =
    document.getElementById(
      "adminEventStartTime"
    );

  const endTimeInput =
    document.getElementById(
      "adminEventEndTime"
    );

  const capacityInput =
    document.getElementById(
      "adminEventCapacity"
    );

  const reservationStartInput =
    document.getElementById(
      "adminEventReservationStart"
    );

  const reservationEndInput =
    document.getElementById(
      "adminEventReservationEnd"
    );

  const statusArea =
    document.getElementById(
      "adminEventStatus"
    );

  const submitButton =
    document.getElementById(
      "adminEventSubmitButton"
    );


  const serviceId =
    serviceSelect
      ? serviceSelect.value
      : "";

  const eventDate =
    eventDateInput
      ? eventDateInput.value
      : "";

  const startTime =
    startTimeInput
      ? startTimeInput.value
      : "";

  const endTime =
    endTimeInput
      ? endTimeInput.value
      : "";

  const capacity =
    capacityInput
      ? Number(
          capacityInput.value || 0
        )
      : 0;

  const reservationStart =
    reservationStartInput
      ? reservationStartInput.value
      : "";

  const reservationEnd =
    reservationEndInput
      ? reservationEndInput.value
      : "";


  if (!serviceId) {
    alert(
      "イベント名を選択してください。"
    );
    return;
  }

  if (!eventDate) {
    alert(
      "開催日を入力してください。"
    );
    return;
  }

  if (!startTime) {
    alert(
      "開始時間を入力してください。"
    );
    return;
  }

  if (!endTime) {
    alert(
      "終了時間を入力してください。"
    );
    return;
  }

  if (
    !Number.isInteger(capacity) ||
    capacity < 1
  ) {
    alert(
      "定員人数を入力してください。"
    );
    return;
  }


  if (
    reservationStart &&
    reservationEnd &&
    reservationStart >
      reservationEnd
  ) {
    alert(
      "予約受付終了日は、受付開始日以降にしてください。"
    );
    return;
  }


  if (
    !window.confirm(
      "この内容で受付を登録しますか？\n\n" +
      serviceSelect.options[
        serviceSelect.selectedIndex
      ].text +
      "\n" +
      eventDate +
      "\n" +
      startTime +
      "〜" +
      endTime +
      "\n定員：" +
      capacity +
      "名"
    )
  ) {
    return;
  }


  if (submitButton) {
    submitButton.disabled =
      true;
  }

  if (statusArea) {
    statusArea.textContent =
      "登録しています...";
  }


  try {
    const response =
      await fetch(
        API_URL,
        {
          method: "POST",

          body:
            new URLSearchParams({
              action:
                "createAdminEvent",

              idToken:
                currentAdminIdToken,

              serviceId:
                serviceId,

              eventDate:
                eventDate,

              startTime:
                startTime,

              endTime:
                endTime,

              capacity:
                String(capacity),

              reservationStart:
                reservationStart,

              reservationEnd:
                reservationEnd
            })
        }
      );


    const data =
      await response.json();


    if (!data.ok) {
      throw new Error(
        data.message ||
        "登録できませんでした。"
      );
    }


    if (statusArea) {
      statusArea.textContent =
        "登録しました。\n" +
        "Event ID：" +
        (
          data.eventId || ""
        );
    }


    alert(
      "受付を登録しました。"
    );


    await showAdminNewEvent();


  } catch (error) {
    if (statusArea) {
      statusArea.textContent =
        "登録できませんでした：" +
        error.message;
    }

  } finally {
    if (submitButton) {
      submitButton.disabled =
        false;
    }
  }
}


async function showAdminNewReservation() {
  showPanel("service");

  const newArea =
    document.getElementById(
      "newReservationArea"
    );

  const editArea =
    document.getElementById(
      "editReservationArea"
    );

  if (editArea) {
    editArea.style.display =
      "none";
  }

  if (!newArea) {
    return;
  }

  newArea.style.display =
    "block";

  newArea.innerHTML =
    "<div class='service-card'>" +
    "<div class='service-name'>新規予約</div>" +
    "<div class='small'>会員情報を読み込み中...</div>" +
    "</div>";

  try {
    const response =
      await fetch(
        API_URL,
        {
          method: "POST",

          body:
            new URLSearchParams({
              action:
                "getAdminReservationFormData",

              idToken:
                currentAdminIdToken
            })
        }
      );

    const data =
      await response.json();

    if (!data.ok) {
      throw new Error(
        data.message ||

      );

    adminNewReservationState = {
  members:
    Array.isArray(data.members)

};

renderAdminNewReservationForm(

);

  } catch (error) {
    newArea.innerHTML =
      "<div class='service-card'>" +
      "<div class='service-name'>新規予約</div>" +
      "<div class='small'>" +
      escapeHtml(
        "取得できませんでした：" +
        error.message
      ) +
      "</div>" +
      "</div>";
  }
}

    function renderAdminNewReservationForm(
  members
) {
  const area =
    document.getElementById(
      "newReservationArea"
    );

  if (!area) {
    return;
  }

  if (
    !Array.isArray(members) ||
    members.length === 0
  ) {
    area.innerHTML =
      "<div class='service-card'>" +
      "<div class='service-name'>新規予約</div>" +
      "<div class='small'>登録されている会員がありません。</div>" +
      "</div>";

    return;
  }


  let memberOptions =
    "<option value=''>会員を選択してください</option>";


  members.forEach(
    function(member) {
      const label =
        (
          member.name ||
          member.cardName ||
          member.memberId
        ) +
        " / " +
        (
          member.rankId ||
          "-"
        ) +
        " / " +
        member.memberId;

      memberOptions +=
        "<option value='" +
        escapeHtml(

    function handleAdminReservationEventChange() {
  const eventSelect =
    document.getElementById(
      "adminReservationEvent"
    );

  const peopleSelect =
    document.getElementById(
      "adminReservationPeople"
    );

  const capacityArea =
    document.getElementById(
      "adminReservationCapacity"
    );

  if (
    !eventSelect ||
    !peopleSelect
  ) {
    return;
  }

  const service =
    adminNewReservationState
      .selectedService;

  if (!service) {
    return;
  }

  const event =
    (service.events || [])
      .find(
        function(item) {
          return (
            String(item.eventId) ===
            String(
              eventSelect.value
            )
          );
        }
      );

  adminNewReservationState
    .selectedEvent =
      event || null;

  if (!event) {
    return;
  }

  if (capacityArea) {
    capacityArea.textContent =
      "残席：" +
      (
        event.remaining === null ||
        typeof event.remaining ===
          "undefined"
          ? "制限なし"
          : event.remaining + "名"
      );
  }

  const minPeople =
    Math.max(
      Number(
        event.minPeople ||
        service.minPeople ||
        1
      ),
      1
    );

  const maxPeople =
    event.remaining === null ||
    typeof event.remaining ===
      "undefined"
      ? 4
      : Math.min(
          Number(event.remaining),
          4
        );

  let html =
    "<option value=''>" +
    "人数を選択してください" +
    "</option>";

  for (
    let people = minPeople;
    people <= maxPeople;
    people++
  ) {
    html +=
      "<option value='" +
      people +
      "'>" +
      people +
      "名</option>";
  }

  peopleSelect.innerHTML =
    html;

  peopleSelect.disabled =
    maxPeople < minPeople;

  renderAdminReservationCompanions();
}

    function isMobileAdminView() {
  return window.matchMedia("(max-width: 767px)").matches;
}

function getReservationStatusLabel(status) {
  const normalizedStatus = String(status || "")
    .trim()
    .toLowerCase();

  if (!isMobileAdminView()) {
    return normalizedStatus;
  }

  const mobileLabels = {
    pending: "申込受付",
    confirmed: "予約確定",
    attended: "来店済み",
    cancelled: "キャンセル"
  };

  return mobileLabels[normalizedStatus] || normalizedStatus;
}

function getStatusButtonLabel(nextStatus) {
  if (isMobileAdminView()) {
    return nextStatus === "attended"
      ? "参加確認済みにする"
      : "キャンセルにする";
  }

  return nextStatus === "attended"
    ? "Mark as attended"
    : "Cancel reservation";
}

/**
 * 取得したデータをフォームへ設定する。
 */
function setReceiptFormValues(
  receipt
) {
  const reservationIdInput =
    document.getElementById(
      "receiptReservationId"
    );

  const recipientSelect =
    document.getElementById(
      "receiptRecipientSelect"
    );

  const recipientNameInput =
    document.getElementById(
      "receiptRecipientName"
    );

  const peopleSelect =
    document.getElementById(
      "receiptPeople"
    );

  const paymentMethodArea =
    document.getElementById(
      "receiptPaymentMethod"
    );

  const descriptionInput =
    document.getElementById(
      "receiptDescription"
    );

  if (reservationIdInput) {
    reservationIdInput.value =
      receipt.reservationId || "";
  }

  if (recipientSelect) {
    recipientSelect.innerHTML = "";

    const recipientOptions =
      Array.isArray(
        receipt.recipientOptions
      ) &&
      receipt.recipientOptions.length > 0
        ? receipt.recipientOptions
        : [receipt.recipientName || ""];

    recipientOptions.forEach(
      function(name) {
        if (!name) return;

        const option =
          document.createElement(
            "option"
          );

        option.value = name;
        option.textContent = name;

        recipientSelect.appendChild(
          option
        );
      }
    );

    const otherOption =
      document.createElement(
        "option"
      );

    otherOption.value = "__OTHER__";
    otherOption.textContent =
      "その他（自由入力）";

    recipientSelect.appendChild(
      otherOption
    );

    recipientSelect.value =
      receipt.recipientName ||
      recipientOptions[0] ||
      "__OTHER__";
  }

  if (recipientNameInput) {
    recipientNameInput.value = "";
    recipientNameInput.style.display =
      "none";
  }

  if (descriptionInput) {
    descriptionInput.value =
      receipt.description ||
      "お食事代として";
  }

  if (paymentMethodArea) {
    paymentMethodArea.textContent =
      receipt.paymentMethodLabel ||
      receipt.paymentMethod ||
      "";
  }

  if (peopleSelect) {
    peopleSelect.innerHTML = "";

    const maxPeople =
      Math.max(
        1,
        Number(
          receipt.maxPeople || 1
        )
      );

    for (
      let people = 1;
      people <= maxPeople;
      people++
    ) {
      const option =
        document.createElement(
          "option"
        );

      option.value =
        String(people);

      option.textContent =
        people + "名分";

      peopleSelect.appendChild(
        option
      );
    }

    /*
     * 原則は申込者本人分のみを初期選択。
     */
    peopleSelect.value = "1";
  }

  updateReceiptAmount();
}


/**
 * 予約者・同行者から宛名候補を作る。
 */
function buildReceiptRecipientOptions(
  reservation
) {
  const names = [];

  function addName(value) {
    const name =
      String(value || "").trim();

    if (
      name &&
      !names.includes(name)
    ) {
      names.push(name);
    }
  }

  addName(reservation.name);

  if (
    Array.isArray(
      reservation.participants
    )
  ) {
    reservation.participants.forEach(
      function(person) {
        addName(person && person.name);
      }
    );
  }

  return names;
}


/**
 * 「その他」選択時だけ自由入力欄を表示する。
 */
function handleReceiptRecipientChange() {
  const recipientSelect =
    document.getElementById(
      "receiptRecipientSelect"
    );

  const recipientNameInput =
    document.getElementById(
      "receiptRecipientName"
    );

  if (
    !recipientSelect ||
    !recipientNameInput
  ) {
    return;
  }

  const useOther =
    recipientSelect.value ===
    "__OTHER__";

  recipientNameInput.style.display =
    useOther ? "block" : "none";

  if (useOther) {
    recipientNameInput.focus();
  } else {
    recipientNameInput.value = "";
  }
}


/**
 * 現在選択されている宛名を取得する。
 */
function getReceiptRecipientName() {
  const recipientSelect =
    document.getElementById(
      "receiptRecipientSelect"
    );

  const recipientNameInput =
    document.getElementById(
      "receiptRecipientName"
    );

  if (
    recipientSelect &&
    recipientSelect.value !==
      "__OTHER__"
  ) {
    return recipientSelect.value.trim();
  }

  return recipientNameInput
    ? recipientNameInput.value.trim()
    : "";
}


/**
 * 選択人数に応じて金額を再計算する。
 */
function updateReceiptAmount() {
  if (!currentReceiptData) {
    return;
  }

  const peopleSelect =
    document.getElementById(
      "receiptPeople"
    );

  const unitPriceArea =
    document.getElementById(
      "receiptUnitPrice"
    );

  const totalAmountArea =
    document.getElementById(
      "receiptTotalAmount"
    );

  const unitPrice =
    Number(
      currentReceiptData.unitPrice ||
      0
    );

  const people =
    peopleSelect
      ? Number(
          peopleSelect.value || 1
        )
      : 1;

  const totalAmount =
    unitPrice * people;

  if (unitPriceArea) {
    unitPriceArea.textContent =
      unitPrice.toLocaleString(
        "ja-JP"
      ) +
      "円";
  }

  if (totalAmountArea) {
    totalAmountArea.textContent =
      totalAmount.toLocaleString(
        "ja-JP"
      ) +
      "円";
  }
}


/**
 * 領収書フォームを閉じる。
 */
function closeReceiptForm() {
  const modal =
    document.getElementById(
      "receiptModal"
    );

  const statusArea =
    document.getElementById(
      "receiptStatus"
    );

  if (modal) {
    modal.classList.remove(
      "active"
    );
  }

  if (statusArea) {
    statusArea.textContent = "";
  }

  currentReceiptData = null;
}


/**
 * 領収書PDFを発行する。
 */
async function issueReceiptFromAdmin() {
  const reservationIdInput =
    document.getElementById(
      "receiptReservationId"
    );

  const recipientSelect =
    document.getElementById(
      "receiptRecipientSelect"
    );

  const recipientNameInput =
    document.getElementById(
      "receiptRecipientName"
    );

  const peopleSelect =
    document.getElementById(
      "receiptPeople"
    );

  const descriptionInput =
    document.getElementById(
      "receiptDescription"
    );

  const statusArea =
    document.getElementById(
      "receiptStatus"
    );

  const issueButton =
    document.getElementById(
      "receiptIssueButton"
    );

  const reservationId =
    reservationIdInput
      ? reservationIdInput.value.trim()
      : "";

  const recipientName =
    getReceiptRecipientName();

  const receiptPeople =
    peopleSelect
      ? Number(
          peopleSelect.value || 1
        )
      : 1;

  const description =
    descriptionInput
      ? descriptionInput.value.trim()
      : "";

  if (!reservationId) {
    alert(
      "予約番号を取得できませんでした。"
    );
    return;
  }

  if (!recipientName) {
    alert(
      "宛名を入力してください。"
    );

    if (
      recipientSelect &&
      recipientSelect.value ===
        "__OTHER__" &&
      recipientNameInput
    ) {
      recipientNameInput.focus();
    } else if (recipientSelect) {
      recipientSelect.focus();
    }

    return;
  }

  if (
    !Number.isInteger(
      receiptPeople
    ) ||
    receiptPeople < 1
  ) {
    alert(
      "領収書対象人数が不正です。"
    );
    return;
  }

  const totalAmount =
    currentReceiptData
      ? (
          Number(
            currentReceiptData
              .unitPrice || 0
          ) *
          receiptPeople
        )
      : 0;

  const confirmed =
    window.confirm(
      "次の内容で領収書を発行しますか？\n\n" +
      "宛名：" +
      recipientName +
      " 様\n" +
      "人数：" +
      receiptPeople +
      "名分\n" +
      "金額：" +
      totalAmount.toLocaleString(
        "ja-JP"
      ) +
      "円"
    );

  if (!confirmed) {
    return;
  }

  if (issueButton) {
    issueButton.disabled = true;
    issueButton.textContent =
      "発行中...";
  }

  if (statusArea) {
    statusArea.textContent =
      "PDFを作成しています...";
  }

  try {
    const response =
      await fetch(
        API_URL,
        {
          method: "POST",

          body:
            new URLSearchParams({
              action:
                "issueReceipt",

              reservationId:
                reservationId,

              recipientName:
                recipientName,

              receiptPeople:
                String(
                  receiptPeople
                ),

              description:
                description
            })
        }
      );

    const data =
      await response.json();

    if (!data.ok) {
      throw new Error(
        data.message ||
        "領収書を発行できませんでした。"
      );
    }

    const amountText =
      Number(
        data.amount || 0
      ).toLocaleString(
        "ja-JP"
      );

    if (statusArea) {
      statusArea.innerHTML =
        "領収書を発行しました。<br>" +
        "No. " +
        escapeHtml(
          data.receiptNo || ""
        ) +
        "<br>" +
        amountText +
        "円" +
        (
          data.pdfUrl
            ? (
                "<a" +
                " class='receipt-pdf-link'" +
                " href='" +
                escapeHtml(
                  data.pdfUrl
                ) +
                "'" +
                " target='_blank'" +
                " rel='noopener noreferrer'>" +
                "PDFを開く" +
                "</a>"
              )
            : ""
        );
    }

    if (
      data.pdfUrl &&
      window.confirm(
        "領収書を発行しました。\nPDFを開きますか？"
      )
    ) {
      window.open(
        data.pdfUrl,
        "_blank",
        "noopener"
      );
    }

  } catch (error) {
    if (statusArea) {
      statusArea.textContent =
        "発行できませんでした：\n" +
        error.message;
    }

    alert(
      "領収書を発行できませんでした：" +
      error.message
    );

  } finally {
    if (issueButton) {
      issueButton.disabled = false;
      issueButton.textContent =
        "PDFを発行する";
    }
  }
}

    async function saveServiceBasic(serviceId) {
      const nameEl = document.getElementById("editName-" + serviceId);
      const sourceEl = document.getElementById("editSource-" + serviceId);
      const rankEl = document.getElementById("editRank-" + serviceId);
      const memoEl = document.getElementById("editMemo-" + serviceId);

      if (!nameEl || !sourceEl || !rankEl || !memoEl) {
        alert("入力欄が見つかりません。");
        return;
      }

      const serviceName = nameEl.value.trim();
      const source = sourceEl.value;
      const requiredRank = rankEl.value;
      const memo = memoEl.value.trim();

      if (!serviceName) {
        alert("サービス名を入力してください。");
        return;
      }

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          body: new URLSearchParams({
            action: "updateServiceBasic",
            serviceId: serviceId,
            serviceName: serviceName,
            source: source,
            requiredRank: requiredRank,
            memo: memo
          })
        });

        const data = await res.json();

        if (!data.ok) {
          alert("保存できませんでした：" + (data.message || ""));
          return;
        }

        alert("変更を保存しました");
        loadServiceBasicEdit();

      } catch (err) {
        alert("保存中にエラーが発生しました：" + err.message);
      }
    }

    function getReservationDate(value) {
      if (!value) return "日付未設定";

      const str = String(value);

      if (str.includes(" ")) {
        return str.split(" ")[0];
      }

      return str;
    }

    function hasText(value) {
      if (value === null || value === undefined) return false;

      const text = String(value)
        .replace(/\s/g, "")
        .trim();

      if (!text) return false;
      if (text === "なし") return false;
      if (text === "-") return false;
      if (text === "無し") return false;
      if (text === "特になし") return false;

      return true;
    }

    function formatMemberNo(value) {
      if (value === null || value === undefined || value === "") {
        return "";
      }

      return String(value).padStart(6, "0");
    }

    function escapeHtml(str) {
      return String(str)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function fromDateTimeLocalValue(value) {
      if (!value) return "";

      return String(value).replace("T", " ").replaceAll("-", "/");
    }

    function toDateTimeLocalValue(value) {
      if (!value) return "";

      const str = String(value).trim();

      if (str.includes("/") && str.includes(" ")) {
        return str.replaceAll("/", "-").replace(" ", "T").slice(0, 16);
      }

      if (str.includes("-") && str.includes(" ")) {
        return str.replace(" ", "T").slice(0, 16);
      }

      if (str.includes("T")) {
        return str.slice(0, 16);
      }

      return "";
    }

}

    async function initAdminAuth() {
  try {
    await liff.init({
      liffId: ADMIN_LIFF_ID
    });

    if (!liff.isLoggedIn()) {
      liff.login();
      return;
    }

    const idToken =
  liff.getIDToken();

if (!idToken) {
  throw new Error(
    "LINE認証情報を取得できませんでした。"
  );
}

currentAdminIdToken =
  idToken;

    const response =
      await fetch(
        API_URL,
        {
          method: "POST",
          body:
            new URLSearchParams({
              action:
                "getAdminAuth",
              idToken:
                idToken
            })
        }
      );

    const data =
  await response.json();

if (!data.ok) {
  const message =
    String(
      data.message || ""
    );

  if (
    message.includes(
      "IdToken expired"
    )
  ) {
    liff.logout();

    liff.login();

    return;
  }

  document.body.innerHTML =
    "<div style='padding:40px;text-align:center;'>"
    + "<h2>アクセスできません</h2>"
    + "<p>"
    + escapeHtml(
        message ||
        "管理権限がありません。"
      )
    + "</p>"
    + "</div>";

  return;
}

    currentAdminAuth = data;

    applyAdminPermissions(
      data
    );

  } catch (error) {
    document.body.innerHTML =
      "<div style='padding:40px;text-align:center;'>"
      + "<h2>認証エラー</h2>"
      + "<p>"
      + escapeHtml(
          error.message ||
          "認証に失敗しました。"
        )
      + "</p>"
      + "</div>";
  }
}
