<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nalu Member Card</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
   body{
      margin:0;
      background:#000;
      color:#fff;
      font-family:"Times New Roman", serif;
      text-align:center;
      padding:24px 16px 40px;
    }

    .wrap{
      width:min(92vw, 420px);
      margin:0 auto;
    }

    .card {
  width: min(82vw, 340px);
  aspect-ratio: 3 / 4.8;
  margin: 0 auto;
  border-radius: 22px;
  overflow: hidden;
  position: relative;
  background-image: url("nalu.png");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}

    .card-bg{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .overlay{
      position:absolute;
      inset:0;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:flex-end;
      padding:0 24px 34px;
      box-sizing:border-box;
      text-shadow:0 2px 10px rgba(0,0,0,.5);
    }

    .memberNo{
      font-size:18px;
      margin:0 0 8px;
    }

    .name{
      font-size:18px;
      margin:0;
    }

    .status{
      margin-top:16px;
      font-size:14px;
      opacity:.95;
      white-space:pre-wrap;
      line-height:1.8;
    }
    .time{
  font-size:14px;
  margin-top:8px;
  opacity:.8;
  letter-spacing:.05em;
}

  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <img id="cardImage" class="card-bg" src="" alt="member card">
     <div class="overlay">
  <div id="memberNo" class="memberNo">No.------</div>
  <div id="name" class="name">読み込み中...</div>
  <div id="time" class="time"></div>
</div>
    </div>
    <div id="status" class="status"></div>
  </div>

  <script>
    const LIFF_ID = "2007730715-HKGPvwvU";
    const API_URL = "https://script.google.com/macros/s/AKfycbxOIqa-TOGIogMYIro9Qu0nG85vZ7ObLFT_YWLW3Q9XHbUmfbXVr9Oxk3zuUZxbtmXe/exec";

    const CARD_IMAGES = {
      WAVE:  "https://nalu-09.github.io/nalu-member-card/wave.png?v=2",
      EVEIL: "https://nalu-09.github.io/nalu-member-card/eveil.png",
      ECLAT: "https://nalu-09.github.io/nalu-member-card/eclat.png",
      NALU:  "https://nalu-09.github.io/nalu-member-card/nalu.png"
    };

    function setCard(rank, memberNo, name) {
      const normalizedRank = String(rank || "WAVE").toUpperCase();
      document.getElementById("cardImage").src = CARD_IMAGES[normalizedRank] || CARD_IMAGES.WAVE;
      document.getElementById("memberNo").textContent = "No." + String(memberNo || "------");
      document.getElementById("name").textContent = name || "";
    }

    function showNotMember() {
      setCard("WAVE", "------", "未登録");
      document.getElementById("status").textContent =
        "会員情報がありません\n現在このLINEアカウントは会員登録されていません。\nご不明点は運営へご確認ください。";
    }

    function showGenericError() {
      setCard("WAVE", "------", "エラー");
      document.getElementById("status").textContent =
        "会員情報を取得できませんでした。\n時間をおいて再度お試しください。";
    }

    async function fetchMemberData(profile) {
      const callbackName = "jsonpCallback_" + Date.now() + "_" + Math.floor(Math.random() * 10000);

      return await new Promise((resolve, reject) => {
        const script = document.createElement("script");

        window[callbackName] = function(response) {
          resolve(response);
          try { delete window[callbackName]; } catch (_) {}
          script.remove();
        };

        script.src =
          API_URL +
          "?callback=" + callbackName +
          "&lineUserId=" + encodeURIComponent(profile.userId) +
          "&name=" + encodeURIComponent(profile.displayName);

        script.onerror = function() {
          reject(new Error("会員情報の取得に失敗しました"));
          try { delete window[callbackName]; } catch (_) {}
          script.remove();
        };

        document.body.appendChild(script);
      });
    }

    async function main() {
      const status = document.getElementById("status");

      try {
        setCard("WAVE", "------", "読み込み中...");
        status.textContent = "LIFF初期化中...";
        await liff.init({ liffId: LIFF_ID });

        if (!liff.isLoggedIn()) {
          status.textContent = "LINEログイン中...";
          liff.login();
          return;
        }

        status.textContent = "プロフィール取得中...";
        const profile = await liff.getProfile();

        status.textContent = "会員情報取得中...";
        const data = await fetchMemberData(profile);

     if (!data.ok) {

  if (data.message === "system_stopped") {
    document.getElementById("name").textContent = "利用停止中";
    status.textContent = "現在この会員システムはご利用いただけません。";
    return;
  }

  if (data.message === "member_not_found") {
    showNoMember();
    return;
  }

  showGenericError();
  return;
}

        const rank = String(data.rank || "WAVE").toUpperCase();
        setCard(
          rank,
          String(data.memberNo || "------"),
          data.name || profile.displayName || ""
        );

        status.textContent = "";
      } catch (e) {
        showGenericError();
      }
    }

    main();
    
    function updateTime() {
  const now = new Date();

  const year = now.getFullYear();
  const month = String(now.getMonth() + 1).padStart(2, "0");
  const day = String(now.getDate()).padStart(2, "0");

  const hours = String(now.getHours()).padStart(2, "0");
  const minutes = String(now.getMinutes()).padStart(2, "0");
  const seconds = String(now.getSeconds()).padStart(2, "0");

  const text = `${year}/${month}/${day} ${hours}:${minutes}:${seconds}`;

  document.getElementById("time").textContent = text;
}

setInterval(updateTime, 1000);
updateTime();
    
  </script>
</body>
</html>
