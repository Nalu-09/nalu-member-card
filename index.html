<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nalu Member Card</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
   body{
      margin:0;
      background:#000;
      color:#fff;
      font-family:"Times New Roman", serif;
      text-align:center;
      padding:24px 16px 40px;
    }

    .wrap{
      width:min(78vw, 420px);
      margin:0 auto;
    }

    .card {
  width: min(82vw, 340px);
  aspect-ratio: 3 / 4.8;
  margin: 0 auto;
  border-radius: 22px;
  overflow: hidden;
  position: relative;
  background-image: url("nalu.png");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}

    .card-bg{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .overlay{
      position:absolute;
      inset:0;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:flex-end;
      padding:0 24px 34px;
      box-sizing:border-box;
      text-shadow:0 2px 10px rgba(0,0,0,.5);
    }

    .memberNo{
      font-size:18px;
      margin:0 0 8px;
    }

    .name{
      font-size:18px;
      margin:0;
    }

    .status{
      margin-top:16px;
      font-size:14px;
      opacity:.95;
      white-space:pre-wrap;
      line-height:1.8;
    }
    .time{
  font-size:14px;
  margin-top:8px;
  opacity:.8;
  letter-spacing:.05em;
}

  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <img id="cardImage" class="card-bg" src="" alt="member card">
     <div class="overlay">
  <div id="memberNo" class="memberNo">No.------</div>
  <div id="name" class="name">読み込み中...</div>
  <div id="time" class="time"></div>
</div>
    </div>
    <div id="status" class="status"></div>
  </div>

<script>
  const LIFF_ID =
    "2007730715-HKGPvwvU";

  /*
   * GASを新しくデプロイした後、
   * 新しいWebアプリURLへ差し替える。
   */
  const API_URL =
    "ここに新しいGAS WebアプリURL";

  const CARD_IMAGES = {
    WAVE:
      "https://nalu-09.github.io/nalu-member-card/wave.png?v=2",

    EVEIL:
      "https://nalu-09.github.io/nalu-member-card/eveil.png",

    ECLAT:
      "https://nalu-09.github.io/nalu-member-card/eclat.png",

    NALU:
      "https://nalu-09.github.io/nalu-member-card/nalu.png"
  };


  /**
   * 会員証を画面へ反映する。
   *
   * @param {string} rank
   * @param {string} memberNo
   * @param {string} name
   */
  function setCard(
    rank,
    memberNo,
    name
  ) {
    const normalizedRank =
      String(rank || "WAVE")
        .trim()
        .toUpperCase();

    document
      .getElementById("cardImage")
      .src =
        CARD_IMAGES[normalizedRank] ||
        CARD_IMAGES.WAVE;

    document
      .getElementById("memberNo")
      .textContent =
        "No." +
        formatMemberNo(memberNo);

    document
      .getElementById("name")
      .textContent =
        name || "";
  }


  /**
   * 会員番号を6桁表示に整える。
   *
   * @param {string|number} value
   * @return {string}
   */
  function formatMemberNo(value) {
    if (
      value === null ||
      value === undefined ||
      value === ""
    ) {
      return "------";
    }

    const text =
      String(value).trim();

    if (!/^\d+$/.test(text)) {
      return text;
    }

    return text.padStart(6, "0");
  }


  /**
   * 未登録の場合の表示。
   */
  function showNotMember() {
    setCard(
      "WAVE",
      "------",
      "未登録"
    );

    document
      .getElementById("status")
      .textContent =
        "会員情報がありません\n" +
        "現在このLINEアカウントは会員登録されていません。\n" +
        "ご不明点は運営へご確認ください。";
  }


  /**
   * 会員証が無効な場合の表示。
   *
   * @param {string} message
   */
  function showInactiveCard(message) {
    setCard(
      "WAVE",
      "------",
      "利用停止中"
    );

    document
      .getElementById("status")
      .textContent =
        message ||
        "現在この会員証はご利用いただけません。";
  }


  /**
   * 通信・システムエラー表示。
   *
   * @param {string} message
   */
  function showGenericError(message) {
    setCard(
      "WAVE",
      "------",
      "エラー"
    );

    document
      .getElementById("status")
      .textContent =
        message ||
        "会員情報を取得できませんでした。\n" +
        "時間をおいて再度お試しください。";
  }


  /**
   * GASから会員証データを取得する。
   *
   * @param {string} idToken
   * @return {Promise<Object>}
   */
  async function fetchMemberCardData(
    idToken
  ) {
    const response =
      await fetch(
        API_URL,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/x-www-form-urlencoded;charset=UTF-8"
          },

          body:
            new URLSearchParams({
              action:
                "getMemberCard",

              idToken:
                idToken
            })
        }
      );

    if (!response.ok) {
      throw new Error(
        "通信エラーが発生しました。"
      );
    }

    return await response.json();
  }


  /**
   * LIFF初期化と会員証表示。
   */
  async function main() {
    const status =
      document.getElementById(
        "status"
      );

    try {
      setCard(
        "WAVE",
        "------",
        "読み込み中..."
      );

      status.textContent =
        "LIFF初期化中...";

      await liff.init({
        liffId: LIFF_ID
      });

      if (!liff.isLoggedIn()) {
        status.textContent =
          "LINEログイン中...";

        liff.login();
        return;
      }

      status.textContent =
        "LINE認証情報を確認中...";

      const idToken =
        liff.getIDToken();

      if (!idToken) {
        throw new Error(
          "LINE認証情報を取得できませんでした。"
        );
      }

      status.textContent =
        "会員情報取得中...";

      const data =
        await fetchMemberCardData(
          idToken
        );

      if (
        !data ||
        !data.success
      ) {
        const code =
          String(
            data && data.code
              ? data.code
              : ""
          );

        if (
          code ===
          "MEMBER_NOT_FOUND"
        ) {
          showNotMember();
          return;
        }

        if (
          code ===
          "CARD_INACTIVE"
        ) {
          showInactiveCard(
            data.message
          );
          return;
        }

        showGenericError(
          data && data.message
            ? data.message
            : ""
        );

        return;
      }

      const member =
        data.member || {};

      setCard(
        member.rankId,
        member.memberId,
        member.cardName
      );

      status.textContent = "";

    } catch (error) {
      console.error(error);

      showGenericError(
        error &&
        error.message
          ? error.message
          : ""
      );
    }
  }


  /**
   * 会員証上の現在日時を更新する。
   */
  function updateTime() {
    const now =
      new Date();

    const year =
      now.getFullYear();

    const month =
      String(
        now.getMonth() + 1
      ).padStart(2, "0");

    const day =
      String(
        now.getDate()
      ).padStart(2, "0");

    const hours =
      String(
        now.getHours()
      ).padStart(2, "0");

    const minutes =
      String(
        now.getMinutes()
      ).padStart(2, "0");

    const seconds =
      String(
        now.getSeconds()
      ).padStart(2, "0");

    document
      .getElementById("time")
      .textContent =
        `${year}/${month}/${day} ` +
        `${hours}:${minutes}:${seconds}`;
  }


  setInterval(
    updateTime,
    1000
  );

  updateTime();
  main();
</script>
</body>
</html>
