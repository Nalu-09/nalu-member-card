<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nalu Member Card</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body {
  margin: 0;
  background: #000;
  color: #fff;
  font-family: "Times New Roman", serif;
  text-align: center;
  padding: 66px 16px 40px;
}

.wrap {
  width: min(92vw, 420px);
  margin: 0 auto;
}

.box {
  background: #0f0f0f;
  border: 1px solid rgba(255,255,255,.12);
  border-radius: 22px;
  padding: 34px 24px 32px;
  box-sizing: border-box;
}

.title {
  font-size: 34px;
  letter-spacing: .18em;
  margin: 0 0 18px;
}

.subtitle {
  font-size: 16px;
  letter-spacing: .06em;
  opacity: .8;
  margin: 0 0 34px;
}

.line {
  height: 1px;
  background: rgba(255,255,255,.14);
  margin: 0 0 34px;
}

.member-block {
  padding: 0;
  margin: 0 0 34px;
}

.member-row {
  font-size: 19px;
  line-height: 2.05;
  letter-spacing: .06em;
}

.message {
  border-top: 1px solid rgba(255,255,255,.14);
  padding-top: 34px;
  font-size: 16px;
  line-height: 2;
  letter-spacing: .04em;
  opacity: .9;
  margin: 0 0 34px;
}

.button {
  display: block;
  width: 100%;
  box-sizing: border-box;
  background: #fff;
  color: #000;
  border: none;
  border-radius: 999px;
  padding: 14px 18px;
  font-size: 16px;
  font-family: "Times New Roman", serif;
  text-decoration: none;
  margin-top: 18px;
}

.sub-button {
  display: block;
  width: 100%;
  box-sizing: border-box;
  background: transparent;
  color: #fff;
  border: 1px solid rgba(255,255,255,.16);
  border-radius: 999px;
  padding: 14px 18px;
  font-size: 16px;
  font-family: "Times New Roman", serif;
  text-decoration: none;
  margin-top: 14px;
}
    
  </style>
</head>
<body>
  div class="wrap">
  <div class="box">
    <h1 class="title">Member Card</h1>
    <p class="subtitle">Nalu-09 会員証</p>

    <div class="line"></div>

    <div class="member-block">
      <div class="member-row">Member No. <span id="memberNo">000000</span></div>
      <div class="member-row">Rank： <span id="rank">NALU</span></div>
      <div class="member-row">Name： <span id="name">Nalu-09 🌊</span></div>
    </div>

    <p class="message">
ご予約・ご参加の際は、
こちらの会員証をご提示ください。
    </p>

    <a class="button" href="https://liff.line.me/2007730715-wxTZ582n?liff.state=%3Fsource%3Dlumiere">
      予約へ進む
    </a>

    <a class="sub-button" href="https://lin.ee/CSEGvvb">
      LINEへ戻る
    </a>
  </div>
</div>

  <script>
    const LIFF_ID = "2007730715-HKGPvwvU";
    const API_URL = "https://script.google.com/macros/s/AKfycbxOIqa-TOGIogMYIro9Qu0nG85vZ7ObLFT_YWLW3Q9XHbUmfbXVr9Oxk3zuUZxbtmXe/exec";

    const CARD_IMAGES = {
      WAVE:  "https://nalu-09.github.io/nalu-member-card/wave.png?v=2",
      EVEIL: "https://nalu-09.github.io/nalu-member-card/eveil.png",
      ECLAT: "https://nalu-09.github.io/nalu-member-card/eclat.png",
      NALU:  "https://nalu-09.github.io/nalu-member-card/nalu.png"
    };

    function setCard(rank, memberNo, name) {
      const normalizedRank = String(rank || "WAVE").toUpperCase();
      document.getElementById("cardImage").src = CARD_IMAGES[normalizedRank] || CARD_IMAGES.WAVE;
      document.getElementById("memberNo").textContent = "No." + String(memberNo || "------");
      document.getElementById("name").textContent = name || "";
    }

    function showNotMember() {
      setCard("WAVE", "------", "未登録");
      document.getElementById("status").textContent =
        "会員情報がありません\n現在このLINEアカウントは会員登録されていません。\nご不明点は運営へご確認ください。";
    }

    function showGenericError() {
      setCard("WAVE", "------", "エラー");
      document.getElementById("status").textContent =
        "会員情報を取得できませんでした。\n時間をおいて再度お試しください。";
    }

    async function fetchMemberData(profile) {
      const callbackName = "jsonpCallback_" + Date.now() + "_" + Math.floor(Math.random() * 10000);

      return await new Promise((resolve, reject) => {
        const script = document.createElement("script");

        window[callbackName] = function(response) {
          resolve(response);
          try { delete window[callbackName]; } catch (_) {}
          script.remove();
        };

        script.src =
          API_URL +
          "?callback=" + callbackName +
          "&lineUserId=" + encodeURIComponent(profile.userId) +
          "&name=" + encodeURIComponent(profile.displayName);

        script.onerror = function() {
          reject(new Error("会員情報の取得に失敗しました"));
          try { delete window[callbackName]; } catch (_) {}
          script.remove();
        };

        document.body.appendChild(script);
      });
    }

    async function main() {
      const status = document.getElementById("status");

      try {
        setCard("WAVE", "------", "読み込み中...");
        status.textContent = "LIFF初期化中...";
        await liff.init({ liffId: LIFF_ID });

        if (!liff.isLoggedIn()) {
          status.textContent = "LINEログイン中...";
          liff.login();
          return;
        }

        status.textContent = "プロフィール取得中...";
        const profile = await liff.getProfile();

        status.textContent = "会員情報取得中...";
        const data = await fetchMemberData(profile);

     if (!data.ok) {

  if (data.message === "system_stopped") {
    document.getElementById("name").textContent = "利用停止中";
    status.textContent = "現在この会員システムはご利用いただけません。";
    return;
  }

  if (data.message === "member_not_found") {
    showNoMember();
    return;
  }

  showGenericError();
  return;
}

        const rank = String(data.rank || "WAVE").toUpperCase();
        setCard(
          rank,
          String(data.memberNo || "------"),
          data.name || profile.displayName || ""
        );

        status.textContent = "";
      } catch (e) {
        showGenericError();
      }
    }

    main();
    
    function updateTime() {
  const now = new Date();

  const year = now.getFullYear();
  const month = String(now.getMonth() + 1).padStart(2, "0");
  const day = String(now.getDate()).padStart(2, "0");

  const hours = String(now.getHours()).padStart(2, "0");
  const minutes = String(now.getMinutes()).padStart(2, "0");
  const seconds = String(now.getSeconds()).padStart(2, "0");

  const text = `${year}/${month}/${day} ${hours}:${minutes}:${seconds}`;

  document.getElementById("time").textContent = text;
}

setInterval(updateTime, 1000);
updateTime();
    
  </script>
</body>
</html>
