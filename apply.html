<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nalu Member Application</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body{
      margin:0;
      background:#000;
      color:#fff;
      font-family:"Times New Roman", serif;
      text-align:center;
      padding:32px 16px 40px;
    }

    .wrap{
      width:min(92vw, 420px);
      margin:0 auto;
    }

    .box{
      background:#0f0f0f;
      border:1px solid rgba(255,255,255,.08);
      border-radius:22px;
      padding:28px 22px;
      box-shadow:0 10px 30px rgba(0,0,0,.35);
    }

    .title{
      font-size:28px;
      margin:0 0 18px;
      letter-spacing:.04em;
    }

    .text{
      font-size:14px;
      line-height:1.9;
      opacity:.95;
      white-space:pre-wrap;
      margin:0 0 22px;
    }

    .field{
      margin:0 0 18px;
      text-align:left;
    }

    .field label{
      display:block;
      font-size:13px;
      margin:0 0 8px;
      opacity:.9;
    }

    .field input{
      width:100%;
      box-sizing:border-box;
      background:#050505;
      color:#fff;
      border:1px solid rgba(255,255,255,.16);
      border-radius:14px;
      padding:12px 14px;
      font-size:14px;
      font-family:"Times New Roman", serif;
      outline:none;
    }

    .field input::placeholder{
      color:rgba(255,255,255,.45);
    }

    .button{
      display:inline-block;
      background:#fff;
      color:#000;
      border:none;
      border-radius:999px;
      padding:12px 24px;
      font-size:14px;
      font-family:"Times New Roman", serif;
      cursor:pointer;
    }

    .button:disabled{
      opacity:.6;
      cursor:not-allowed;
    }

    .status{
      margin-top:18px;
      font-size:14px;
      line-height:1.8;
      white-space:pre-wrap;
      opacity:.95;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="box">
      <h1 class="title">Membership Application</h1>

      <p class="text" id="introText">
ご案内ありがとうございます。
こちらのページは、会員申請のための専用ページです。

会員証の申請には
運営よりご案内している申請パスワードが必要です。

内容を確認のうえ
承認後に会員証をご利用いただけます。
      </p>

      <div class="field">
        <label for="applicationPassword">申請パスワード</label>
        <input
          type="password"
          id="applicationPassword"
          placeholder="申請パスワードを入力"
          autocomplete="off"
        >
      </div>

      <button id="applyBtn" class="button">会員申請を送信する</button>
      <div id="status" class="status"></div>
    </div>
  </div>

  <script>
    const LIFF_ID = "2007730715-HKGPvwvU";
    const API_URL = "https://script.google.com/macros/s/AKfycbxOIqa-TOGIogMYIro9Qu0nG85vZ7ObLFT_YWLW3Q9XHbUmfbXVr9Oxk3zuUZxbtmXe/exec";

    let currentProfile = null;

    async function initLiff() {
      const status = document.getElementById("status");

      try {
        status.textContent = "LIFF初期化中...";
        await liff.init({ liffId: LIFF_ID });

        if (!liff.isLoggedIn()) {
          status.textContent = "LINEログイン中...";
          liff.login();
          return;
        }

        currentProfile = await liff.getProfile();
        status.textContent = "";
      } catch (e) {
        status.textContent = "ページを開けませんでした。\n時間をおいて再度お試しください。";
        document.getElementById("applyBtn").disabled = true;
      }
    }

    async function submitApplication() {
      const btn = document.getElementById("applyBtn");
      const status = document.getElementById("status");
      const passwordInput = document.getElementById("applicationPassword");

      if (!currentProfile) {
        status.textContent = "プロフィールを取得できていません。";
        return;
      }

      const applicationPassword = passwordInput.value.trim();

      if (!applicationPassword) {
        status.textContent = "申請パスワードをご入力ください。";
        return;
      }

      try {
        btn.disabled = true;
        btn.textContent = "送信中...";

        const body = new URLSearchParams({
          action: "submitApplication",
          lineUserId: currentProfile.userId,
          displayName: currentProfile.displayName || "",
          applicationPassword: applicationPassword
        });

        const res = await fetch(API_URL, {
          method: "POST",
          body: body
        });

        const data = await res.json();

        if (!data.ok) {
          if (data.message === "invalid_password") {
            status.textContent =
              "申請パスワードが正しくありません。\nご確認のうえ、再度お試しください。";
            btn.disabled = false;
            btn.textContent = "会員申請を送信する";
            return;
          }

          if (data.message === "already_applied") {
            status.textContent =
              "このLINEアカウントは、すでに申請済みまたは承認済みです。\nご案内をお待ちください。";
            btn.style.display = "none";
            passwordInput.disabled = true;
            return;
          }

          status.textContent =
            "申請を受け付けできませんでした。\n時間をおいて再度お試しください。";
          btn.disabled = false;
          btn.textContent = "会員申請を送信する";
          return;
        }

        status.textContent =
          "会員申請を受け付けました。\n内容を確認のうえ、承認後にご利用いただけます。\nしばらくお待ちください。";

        btn.style.display = "none";
        passwordInput.disabled = true;

      } catch (e) {
        status.textContent =
          "申請を受け付けできませんでした。\n時間をおいて再度お試しください。";
        btn.disabled = false;
        btn.textContent = "会員申請を送信する";
      }
    }

    document.getElementById("applyBtn").addEventListener("click", submitApplication);

    initLiff();
  </script>
</body>
</html>
