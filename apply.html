<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nalu Member Application</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body{
      margin:0;
      background:#000;
      color:#fff;
      font-family:"Times New Roman", "Yu Mincho", "Hiragino Mincho ProN", serif;
      text-align:center;
      padding:32px 16px 40px;
    }

    .wrap{
      width:min(92vw, 420px);
      margin:0 auto;
    }

    .box{
      background:#0f0f0f;
      border:1px solid rgba(255,255,255,.08);
      border-radius:22px;
      padding:28px 22px;
      box-shadow:0 10px 30px rgba(0,0,0,.35);
    }

    .title{
      font-size:28px;
      margin:0 0 18px;
      letter-spacing:.04em;
      line-height:1.35;
    }

    .text{
      font-size:14px;
      line-height:1.9;
      opacity:.95;
      white-space:pre-wrap;
      margin:0 0 28px;
    }

    .field{
      margin:0 0 18px;
      text-align:left;
    }

    .field label{
      display:block;
      font-size:13px;
      margin:0 0 8px;
      opacity:.9;
      letter-spacing:.04em;
    }

    .field input,
    .field textarea{
      width:100%;
      box-sizing:border-box;
      background:#050505;
      color:#fff;
      border:1px solid rgba(255,255,255,.16);
      border-radius:14px;
      padding:12px 14px;
      font-size:14px;
      font-family:"Times New Roman", "Yu Mincho", "Hiragino Mincho ProN", serif;
      outline:none;
    }

    .field textarea{
      min-height:82px;
      resize:vertical;
      line-height:1.7;
    }

    .field input::placeholder,
    .field textarea::placeholder{
      color:rgba(255,255,255,.45);
    }

    .note{
      margin:7px 0 0;
      font-size:11px;
      line-height:1.7;
      color:rgba(255,255,255,.62);
    }

    .optional{
      font-size:11px;
      color:rgba(255,255,255,.55);
      margin-left:4px;
    }

    .button{
      display:inline-block;
      background:#fff;
      color:#000;
      border:none;
      border-radius:999px;
      padding:12px 24px;
      font-size:14px;
      font-family:"Times New Roman", "Yu Mincho", "Hiragino Mincho ProN", serif;
      cursor:pointer;
      margin-top:6px;
    }

    .button:disabled{
      opacity:.6;
      cursor:not-allowed;
    }

    .status{
      margin-top:18px;
      font-size:14px;
      line-height:1.8;
      white-space:pre-wrap;
      opacity:.95;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="box">
      <h1 class="title">Membership<br>Application</h1>

      <p class="text" id="introText">
ご案内ありがとうございます。
こちらは、会員申請のための専用ページです。

会員証の申請には、専用パスワードが必要です。

申請内容を確認し
審査通過後に会員証をご利用いただけます。
      </p>

      <div class="field">
        <label for="cardName">カード表記名</label>
        <input
          id="cardName"
          name="cardName"
          type="text"
          maxlength="12"
          placeholder="12文字以内・絵文字可"
          required
        >
        <p class="note">会員証に表示されるお名前です。12文字以内でご入力ください。</p>
      </div>

      <div class="field">
        <label for="realName">名前</label>
        <input
          id="realName"
          name="realName"
          type="text"
          placeholder="お名前"
          required
        >
      </div>

      <div class="field">
        <label for="nameKana">名前（カナ）</label>
        <input
          id="nameKana"
          name="nameKana"
          type="text"
          placeholder="オナマエ"
          required
        >
      </div>

      <div class="field">
        <label for="birthday">誕生日</label>
        <input
          id="birthday"
          name="birthday"
          type="date"
          required
        >
      </div>

      <div class="field">
        <label for="dislikedFoods">苦手食材 <span class="optional">任意</span></label>
        <textarea
          id="dislikedFoods"
          name="dislikedFoods"
          placeholder="例：パクチー、牡蠣"
        ></textarea>
        <p class="note">苦手食材がございましたらご記入ください。</p>
      </div>

      <div class="field">
        <label for="allergy">アレルギー <span class="optional">任意</span></label>
        <textarea
          id="allergy"
          name="allergy"
          placeholder="例：甲殻類、そば、卵"
        ></textarea>
        <p class="note">アレルギー食材がございましたらご記入ください。</p>
      </div>

      <div class="field">
        <label for="applicationPassword">申請パスワード</label>
        <input
          type="password"
          id="applicationPassword"
          placeholder="申請パスワードを入力"
          autocomplete="off"
        >
      </div>

      <button id="applyBtn" class="button">会員申請を送信する</button>
      <div id="status" class="status"></div>
    </div>
  </div>

  <script>
    const LIFF_ID = "2007730715-0wmIs1fy";
    const API_URL = "https://script.google.com/macros/s/AKfycbxOIqa-TOGIogMYIro9Qu0nG85vZ7ObLFT_YWLW3Q9XHbUmfbXVr9Oxk3zuUZxbtmXe/exec";

    let currentProfile = null;

    async function initLiff() {
      const status = document.getElementById("status");

      try {
        status.textContent = "LIFF初期化中...";
        await liff.init({ liffId: LIFF_ID });

        if (!liff.isLoggedIn()) {
          status.textContent = "LINEログイン中...";
          liff.login();
          return;
        }

        currentProfile = await liff.getProfile();
        status.textContent = "";
      } catch (e) {
        status.textContent = "ページを開けませんでした。\n時間をおいて再度お試しください。";
        document.getElementById("applyBtn").disabled = true;
      }
    }

    function getValue(id) {
      return document.getElementById(id).value.trim();
    }

    function validateForm() {
      const cardName = getValue("cardName");
      const realName = getValue("realName");
      const nameKana = getValue("nameKana");
      const birthday = getValue("birthday");
      const applicationPassword = getValue("applicationPassword");

      if (!cardName) {
        return "カード表記名をご入力ください。";
      }

      if ([...cardName].length > 12) {
        return "カード表記名は12文字以内でご入力ください。";
      }

      if (!realName) {
        return "名前をご入力ください。";
      }

      if (!nameKana) {
        return "名前（カナ）をご入力ください。";
      }

      if (!birthday) {
        return "誕生日をご入力ください。";
      }

      if (!applicationPassword) {
        return "申請パスワードをご入力ください。";
      }

      return "";
    }

    async function submitApplication() {
      const btn = document.getElementById("applyBtn");
      const status = document.getElementById("status");
      const passwordInput = document.getElementById("applicationPassword");

      if (!currentProfile) {
        status.textContent = "プロフィールを取得できていません。";
        return;
      }

      const errorMessage = validateForm();

      if (errorMessage) {
        status.textContent = errorMessage;
        return;
      }

      const cardName = getValue("cardName");
      const realName = getValue("realName");
      const nameKana = getValue("nameKana");
      const birthday = getValue("birthday");
      const dislikedFoods = getValue("dislikedFoods");
      const allergy = getValue("allergy");
      const applicationPassword = getValue("applicationPassword");

      try {
        btn.disabled = true;
        btn.textContent = "送信中...";
        status.textContent = "";

        const body = new URLSearchParams({
          action: "submitApplication",
          lineUserId: currentProfile.userId,
          displayName: currentProfile.displayName || "",
          applicationPassword: applicationPassword,
          cardName: cardName,
          realName: realName,
          nameKana: nameKana,
          birthday: birthday,
          dislikedFoods: dislikedFoods,
          allergy: allergy
        });

        const res = await fetch(API_URL, {
          method: "POST",
          body: body
        });

        const data = await res.json();

        if (!data.ok) {
          if (data.message === "invalid_password") {
            status.textContent =
              "申請パスワードが正しくありません。\nご確認のうえ、再度お試しください。";
            btn.disabled = false;
            btn.textContent = "会員申請を送信する";
            return;
          }

          if (data.message === "already_applied") {
            status.textContent =
              "このLINEアカウントは\nすでに申請済みまたは承認済みです。\nご案内をお待ちください。";
            btn.style.display = "none";
            passwordInput.disabled = true;
            return;
          }

          if (data.message === "invalid_card_name") {
            status.textContent =
              "カード表記名は12文字以内でご入力ください。";
            btn.disabled = false;
            btn.textContent = "会員申請を送信する";
            return;
          }

          if (data.message === "missing_required_fields") {
            status.textContent =
              "未入力の必須項目があります。\n内容をご確認ください。";
            btn.disabled = false;
            btn.textContent = "会員申請を送信する";
            return;
          }

          status.textContent =
            "申請を受け付けできませんでした。\n時間をおいて再度お試しください。";
          btn.disabled = false;
          btn.textContent = "会員申請を送信する";
          return;
        }

        status.textContent =
          "会員申請を受け付けました。\n内容を確認のうえ、承認後にご利用いただけます。\nしばらくお待ちください。";

        btn.style.display = "none";

        document.getElementById("cardName").disabled = true;
        document.getElementById("realName").disabled = true;
        document.getElementById("nameKana").disabled = true;
        document.getElementById("birthday").disabled = true;
        document.getElementById("dislikedFoods").disabled = true;
        document.getElementById("allergy").disabled = true;
        passwordInput.disabled = true;

      } catch (e) {
        status.textContent =
          "申請を受け付けできませんでした。\n時間をおいて再度お試しください。";
        btn.disabled = false;
        btn.textContent = "会員申請を送信する";
      }
    }

    document.getElementById("applyBtn").addEventListener("click", submitApplication);

    initLiff();
  </script>
</body>
</html>
